<script>
  /* GI CONTESTANT SIGNUP — live GHL embed, permanent GI sub-account form.
     The ?src= query param (northland/chamber/aca/realtor/social/card —
     the six QR codes) is read on load and passed straight through to the
     embed so source tracking survives in GHL. Form ID stays
     p7FC8idY6HwpFud2p8kM until Tim sends the V02 id from GHL. */
  var GI_FORM_ID = 'p7FC8idY6HwpFud2p8kM';
</script>

<script>
/* Point the embed at GI_FORM_ID (defined at the top of <head>) and pass the
   ?src= tracking param straight through — GHL's own workflow does the rest
   (tagging, pipeline card, notifications, SMS). Unchanged from the prior
   build — kept exactly as specified ("keep the current embed and resize
   script"). */
(function () {
  'use strict';
  var params = new URLSearchParams(window.location.search);
  var src = params.get('src');
  var url = 'https://links.ninja360.net/widget/form/' + GI_FORM_ID;
  if (src) url += '?src=' + encodeURIComponent(src);
  document.getElementById('gi-signup-iframe').src = url;
})();
</script>
