<style>
  /* Promo video pop-up (Tim, 9/22/26) — same pattern as the home page's
     trailer pop-up: shows once per visit, autoplays muted with a "Tap for
     sound" button (browsers block unmuted autoplay either way). Playback is
     hard-capped at 51s: the source file glitches out after that (a bad
     render on the outro), so it never gets the chance to play. */
  #promo-popup{
    position:fixed; inset:0; z-index:500; background:rgba(24,23,21,.92);
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:1; visibility:visible;
    transition:opacity .25s ease, visibility 0s linear 0s;
  }
  #promo-popup.hide{ opacity:0; visibility:hidden; pointer-events:none; transition:opacity .25s ease, visibility 0s linear .25s; }
  .promo-popup-frame{
    position:relative; width:min(92vw,720px); border-radius:8px; overflow:hidden;
    background:var(--gi-ink); border:2px solid var(--gi-red); box-shadow:0 16px 44px rgba(0,0,0,.5);
  }
  .promo-popup-frame video{ display:block; width:100%; aspect-ratio:16/9; background:var(--gi-ink); }
  #promo-popup-close{
    position:absolute; top:8px; right:8px; z-index:2; width:34px; height:34px; border-radius:50%;
    background:rgba(0,0,0,.55); color:var(--gi-panel); border:1px solid rgba(255,255,255,.35);
    font-size:16px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  #promo-popup-close:hover{ background:rgba(0,0,0,.75); }
  .promo-popup-actions{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center;
    padding:12px; background:var(--gi-ink); border-top:2px solid var(--gi-red);
  }
  #promo-sound-btn{
    padding:12px 22px; min-height:44px; border-radius:999px; cursor:pointer;
    background:var(--gi-red); color:var(--gi-panel); border:2px solid var(--gi-panel);
    font-family:var(--gi-font-display); font-weight:400; letter-spacing:.08em;
    text-transform:uppercase; font-size:14px;
  }
  #promo-sound-btn:hover{ filter:brightness(1.12); }
  #promo-popup-skip{
    padding:12px 20px; min-height:44px; border-radius:999px; cursor:pointer;
    background:transparent; color:var(--gi-panel); border:2px solid rgba(255,255,255,.5);
    font-family:var(--gi-font-display); font-weight:400; letter-spacing:.08em;
    text-transform:uppercase; font-size:13px;
  }
  #promo-popup-skip:hover{ border-color:var(--gi-panel); }
</style>

<script>
/* Promo video pop-up — shows every time this page is landed on (Tim,
   9/22/26: it should pop up again if they click back to the page, so
   unlike the home page intro this does NOT suppress itself with
   sessionStorage). Autoplays muted, closes on the X, on "Skip to the
   form", on Esc, on a click outside, and at the 51s mark — the source
   file glitches out past that (bad render on the outro), so playback
   never reaches it. Plain HTML5 <video> API since this is a self-hosted
   file, not a YouTube embed. */
(function () {
  'use strict';
  var popup = document.getElementById('promo-popup');
  var closeBtn = document.getElementById('promo-popup-close');
  var skipBtn = document.getElementById('promo-popup-skip');
  var soundBtn = document.getElementById('promo-sound-btn');
  var video = document.getElementById('gi-promo-video');
  if (!popup || !video) return;

  var CUTOFF = 51; // seconds — last clean frame before the outro glitch

  function closePopup() {
    popup.classList.add('hide');
    video.pause();
  }

  if (closeBtn) closeBtn.addEventListener('click', closePopup);
  if (skipBtn) skipBtn.addEventListener('click', closePopup);
  popup.addEventListener('click', function (e) {
    if (e.target === popup) closePopup();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !popup.classList.contains('hide')) closePopup();
  });
  video.addEventListener('timeupdate', function () {
    if (video.currentTime >= CUTOFF) closePopup();
  });

  if (soundBtn) {
    soundBtn.addEventListener('click', function () {
      if (video.muted) {
        video.muted = false;
        video.volume = 1;
        soundBtn.textContent = '🔇 Mute';
        soundBtn.setAttribute('aria-pressed', 'true');
      } else {
        video.muted = true;
        soundBtn.textContent = '🔊 Tap for sound';
        soundBtn.setAttribute('aria-pressed', 'false');
      }
    });
  }

  // Clicking the browser Back button can restore this page from bfcache
  // instead of reloading it — the popup would otherwise stay hidden with
  // the video sitting mid-playback, since no script re-runs on that kind
  // of restore. Reset everything when that happens.
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    popup.classList.remove('hide');
    video.currentTime = 0;
    video.muted = true;
    if (soundBtn) {
      soundBtn.textContent = '🔊 Tap for sound';
      soundBtn.setAttribute('aria-pressed', 'false');
    }
    video.play().catch(function () {});
  });
})();
</script>
<script>
/* Point the embed at GI_FORM_ID (defined at the top of <head>) and pass the
   ?src= tracking param straight through — GHL's own workflow does the rest
   (tagging, pipeline card, notifications, SMS). Unchanged from the prior
   build — kept exactly as specified ("keep the current embed and resize
   script"). */
(function () {
  'use strict';
  var params = new URLSearchParams(window.location.search);
  var src = params.get('src');
  var url = 'https://links.ninja360.net/widget/form/' + GI_FORM_ID;
  if (src) url += '?src=' + encodeURIComponent(src);
  document.getElementById('gi-signup-iframe').src = url;
})();
</script>
