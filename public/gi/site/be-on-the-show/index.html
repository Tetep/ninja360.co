<section>
  <div class="wrap center">
    <!-- Promo video (Tim, 10/21/26) — no longer a forced autoplay pop-up;
         just sits inline above the form with native controls, so it's
         there to watch but never in the way. -->
    <div class="video-frame" style="max-width:640px;margin:0 auto 28px">
      <video src="../assets/be-on-the-show-promo.mp4" controls playsinline></video>
    </div>
    <div class="signup-panel" style="margin-top:0;max-width:600px">
      <!-- Swapped to the Google Form (Tim, interim form while GHL is sorted
           out). Standard Google Forms embed: ?embedded=true, fixed height —
           Google Forms has no cross-origin auto-resize script the way GHL's
           form_embed.js did, so a long form shows its own internal scrollbar
           inside the iframe if it runs past this height. The old ?src=
           QR-source-tracking passthrough is dropped for now; it depended on
           GHL's field mapping and doesn't carry over automatically. -->
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdIn8QpHLdFLGMXhl8lrP4_D2UWtOj5lbSGiLLGJBYjVm-rKA/viewform?embedded=true" style="width:100%;height:1400px;border:0;display:block" title="Contestant signup" loading="lazy">Loading…</iframe>
    </div>
    <p class="small muted" style="margin-top:16px">Questions? <a href="mailto:hello@generationallyincorrect.com">hello@generationallyincorrect.com</a></p>
  </div>
</section>
