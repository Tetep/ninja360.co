<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light dark}body{margin:0;padding:0}img{max-width:100%}</style>
</head>
<body>
<title>Ninja-360 Run Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F1ED; --surf:#FFFFFF; --surf2:#FAF7F4; --surf3:#EFE9E3;
  --ink:#231E1A; --ink2:#6B6058; --ink3:#746A61; --line:#E3DAD1; --line2:#D2C6BA;
  --accent:#B54903; --accent-ink:#FFFFFF; --accent-soft:#FCEADA;
  --vz:#CD040B; --vz-soft:#F9DCDC; --vz-fog:#B5AEA7;   /* Verizon red — the scoreboard's one loud colour; fog hides the ninja until a stop is shot */
  --money:#2C6B4F; --money-soft:#E2F0E8;
  --warn:#8F6410; --warn-soft:#FAEFD8;
  --bad:#A2352A; --bad-soft:#F8E3E0;
  --ret:#8B2FC9;
  --shadow:0 1px 2px rgba(60,42,28,.07),0 4px 14px rgba(60,42,28,.05);
  --head-bg:#231E1A; --head-ink:#FBF7F3; --head-sub:#B9AC9F; --head-line:#4A4139;
  --scrim:rgba(35,30,26,.45);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#151310; --surf:#1E1B17; --surf2:#232019; --surf3:#2C2820;
  --ink:#F1EBE4; --ink2:#A99C90; --ink3:#9A8F83; --line:#332D25; --line2:#443C32;
  --accent:#F4801F; --accent-ink:#1A1409; --accent-soft:#3A2410;
  --vz:#F0141B; --vz-soft:#3B1517; --vz-fog:#4A443D;
  --money:#6FC49B; --money-soft:#1B3327;
  --warn:#E0AC4C; --warn-soft:#33280F;
  --bad:#EE8377; --bad-soft:#3A1F1B;
  --ret:#C77DFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --head-bg:#0E0C0A; --head-ink:#F1EBE4; --head-sub:#95897E; --head-line:#3A332B;
  --scrim:rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#151310; --surf:#1E1B17; --surf2:#232019; --surf3:#2C2820;
  --ink:#F1EBE4; --ink2:#A99C90; --ink3:#9A8F83; --line:#332D25; --line2:#443C32;
  --accent:#F4801F; --accent-ink:#1A1409; --accent-soft:#3A2410;
  --vz:#F0141B; --vz-soft:#3B1517; --vz-fog:#4A443D;
  --money:#6FC49B; --money-soft:#1B3327;
  --warn:#E0AC4C; --warn-soft:#33280F;
  --bad:#EE8377; --bad-soft:#3A1F1B;
  --ret:#C77DFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --head-bg:#0E0C0A; --head-ink:#F1EBE4; --head-sub:#95897E; --head-line:#3A332B;
  --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 13px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h2{font-size:15px;margin:16px 0 7px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lab{font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:600;color:var(--ink3)}
.hide{display:none!important}
header{background:var(--head-bg);color:var(--head-ink);padding:12px 0 10px}
header h1{font-size:18px;letter-spacing:-.2px;color:var(--head-ink)}
header .sub{font-size:12px;color:var(--head-sub);margin-top:1px}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hbtns{display:flex;gap:6px;align-items:center}
.tbtn{border:1px solid var(--head-line);color:var(--head-ink);border-radius:8px;padding:6px 10px;font-size:12px;min-height:32px}
/* who's running: their emblem sits right beside the Ninja mark — one tap to switch */
.whochip{width:38px;height:38px;border-radius:50%;padding:0;flex:none;overflow:hidden;margin-left:-4px;
  border:2px solid var(--accent);background:#141414;color:var(--head-ink);display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 4px rgba(0,0,0,.25)}
.whochip img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.whochip .wn{font-weight:800;font-size:15px;line-height:1}
.whochip.empty{border-style:dashed;opacity:.85}
.shbtn.who{display:flex;align-items:center;gap:10px}
.shbtn.who img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#111;flex:none;border:2px solid var(--line2)}
.shbtn.who.cur img{border-color:var(--accent)}
.bychip{width:16px;height:16px;border-radius:50%;object-fit:cover;vertical-align:-3px;margin-left:4px;background:#111}
#syncChip{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px}
#syncChip.ok{color:#9CD8B4;border-color:#3E594A}
#syncChip.busy{color:var(--head-sub)}
#syncChip.warn2{color:#E0AC4C;border-color:#5C4A1E}
/* counters */
.counters{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
  border-bottom:1px solid var(--line)}
@media(min-width:560px){.counters{grid-template-columns:repeat(4,1fr)}}
.cc{background:var(--surf);padding:7px 12px}
.cc .v{font-size:16px;font-weight:700;letter-spacing:-.3px}
.cc .v.g{color:var(--money)} .cc .v.o{color:var(--accent)} .cc .v.w{color:var(--warn)}
/* strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:11px;overflow:hidden;margin:9px 0}
@media(min-width:640px){.strip{grid-template-columns:repeat(6,1fr)}}
.strip.four{grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.strip.four{grid-template-columns:repeat(4,1fr)}}
.mcell{background:var(--surf);padding:7px 10px}
.mcell .v{font-size:16px;font-weight:700;letter-spacing:-.3px;margin-top:1px}
.mcell .v.g{color:var(--money)} .mcell .v.w{color:var(--warn)} .mcell .v.b{color:var(--bad)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:11px;box-shadow:var(--shadow);margin-bottom:10px}
.brand-hero{position:relative;display:flex;justify-content:center;align-items:center;margin:8px 0 14px;padding:6px 0;transition:opacity .7s ease,transform .7s ease,height .7s ease,margin .7s ease,padding .7s ease;overflow:hidden}
.brand-hero.is-done{opacity:0;transform:translateY(-8px);height:0;margin:0;padding:0;pointer-events:none}
.brand-video-frame{position:relative;width:min(100%,980px);margin:0 auto;border-radius:18px;overflow:hidden;background:#060808;box-shadow:0 18px 40px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.04)}
.brand-video-frame video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
.brand-logo-overlay{position:absolute;right:14px;bottom:12px;width:92px;max-width:28%;height:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.42));z-index:1}
.brand-panel{background:transparent;border:none;border-radius:0;box-shadow:none;overflow:visible;padding:0}
/* the brand, always on: header lockup + the Plan tab's entry panel (ninja360.net tokens: charcoal + orange) */
.hbrand{display:flex;align-items:center;gap:10px;min-width:0}
.hmark{width:38px;height:38px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.hbrand h1{letter-spacing:-.01em;white-space:nowrap}
.h360{color:#FF8D2D}
.h1sub{font-weight:500;opacity:.7;font-size:.78em}
.brand-static{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 14px;margin:6px 0 12px;padding:14px 16px;
  border-radius:16px;background:linear-gradient(135deg,#31343B,#1d1f24);color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.22);overflow:hidden}
.brand-static .bs-word{font:800 clamp(26px,7vw,40px)/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:-.02em}
.brand-static .bs-word span{color:#FF8D2D}
.brand-static .bs-tag{font-weight:600;font-size:13px;letter-spacing:.02em;color:#d4d7dd;grid-column:1}
.brand-static img{grid-column:2;grid-row:1/3;width:min(34vw,150px);height:auto;max-height:96px;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}
.evin{display:inline-flex;align-items:center;gap:6px}
.evin input{width:66px}
.mcell .bat{text-transform:none;letter-spacing:0;font-weight:600;margin-top:2px}
.brand-panel img,.brand-panel video{display:block;width:min(100%,760px);height:auto;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.38))}
.brand-hero .brand-main img{max-height:440px}
.brand-hero .brand-video{display:none}
.brand-strip{display:none}
.rail{display:flex;gap:6px;overflow-x:auto;padding:2px 0 7px}
.rail::-webkit-scrollbar{height:5px}.rail::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.dchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surf);border-radius:10px;
  padding:6px 10px;text-align:left;min-width:100px;box-shadow:var(--shadow)}
.dchip.on{border-color:var(--accent);background:var(--accent-soft)}
.dchip .dd{font-size:10.5px;color:var(--ink2);font-weight:600}
.dchip .dv{font-size:14px;font-weight:700}
.dchip .dn{font-size:10px;color:var(--ink3)}
.dchip.add{min-width:auto;display:flex;align-items:center;color:var(--accent);font-weight:600;border-style:dashed}
.fld{display:flex;flex-direction:column;gap:3px}
.row{display:flex;flex-wrap:wrap;gap:7px;align-items:end}
select,input[type=date],input[type=time],input[type=text],input[type=number]{
  padding:8px 9px;border:1px solid var(--line2);border-radius:8px;background:var(--surf2);
  color:var(--ink);font-size:13.5px;font-family:inherit;max-width:210px;min-height:36px}
.ghost{border:1px solid var(--line2);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;background:var(--surf2);min-height:36px}
.ghost.danger{color:var(--bad);border-color:var(--bad)}
.prim{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 14px;font-weight:600;font-size:13.5px;min-height:38px}
.stop{display:grid;grid-template-columns:58px 1fr auto;gap:9px;align-items:start;
  background:var(--surf);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:10px;padding:9px 10px;margin-bottom:6px;box-shadow:var(--shadow)}
.stop.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.stop.wait{border-left-color:var(--warn)}
.stop.done{border-left-color:var(--money);opacity:.72}
.stop .tm{font-size:12px;font-weight:600;color:var(--ink2)}
.stop .tm .to{display:block;color:var(--ink3);font-weight:400}
.stop .nm{font-size:14px;font-weight:600;line-height:1.25}
.stop .ad{font-size:12px;color:var(--ink2);margin-top:2px}
.stop .hrs{font-size:11px;color:var(--ink3);margin-top:3px}
.stop .pay{font-size:14px;font-weight:700;color:var(--money);white-space:nowrap}
.acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line2);border-radius:7px;min-width:30px;min-height:30px;padding:0 8px;font-size:12px;
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);background:var(--surf2)}
.mini.x{color:var(--bad);border-color:var(--bad)}
.mini.go{color:var(--accent);border-color:var(--accent);font-weight:600}
.tset{font:inherit;color:var(--accent);text-decoration:underline dotted;
  display:inline-flex;align-items:center;min-height:26px;padding:2px 6px;margin:-2px -2px}
.job-note{font-size:12px;color:var(--ink2);margin-top:6px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surf2)}
.job-note .mono{font-size:11px}
.live-timer{display:inline-flex;align-items:center;gap:6px;padding:2px 6px;border-radius:999px;border:1px solid var(--line2);background:var(--surf2);font-size:11px;font-weight:600;color:var(--ink2)}
.live-timer.running{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:1px;white-space:nowrap}
.badge.v{background:var(--money-soft);color:var(--money)}
.badge.a{background:var(--surf3);color:var(--ink2)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.badge.pl{background:var(--accent-soft);color:var(--accent);border:1px dashed var(--accent)}   /* PLANNED — on a locked plan, not shot yet */
.badge.pd{background:var(--money-soft);color:var(--money);border:1px solid var(--money)}       /* PAID — QuickBooks shows it settled; reads in both themes */
.stop.planned{border-left-style:dashed}
/* a locked plan: one bar over the day, the list underneath frozen */
.lockbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 6px;padding:8px 11px;
  border:1px solid var(--accent);border-radius:10px;background:var(--accent-soft);font-size:13px}
.lockbar b{font-size:13.5px;letter-spacing:.3px}
.lockbar .lockmeta{flex:1;min-width:140px;color:var(--ink2);font-size:12px}
.lockbar button{padding:6px 12px;min-height:36px;font-size:12.5px}
/* IDS update rows: id · name · date, and nothing wider than the phone */
.idsrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
.hint+.idsrow,.idsrow:first-child{border-top:0}
.idsrow .idsid,.idsrow .idsd{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;white-space:nowrap}
.idsrow .idsid{color:var(--ink2)}
.idsrow .idsd{text-align:right}
.idsrow .idsn{min-width:0;overflow-wrap:anywhere}
.idsrow .ad{font-size:11.5px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.filters input{flex:1;min-width:130px;max-width:none}
.pj{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;
  background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px}
.pj.used{opacity:.45}
.pj .nm{font-size:13.5px;font-weight:600;line-height:1.25}
.pj .ad{font-size:11.5px;color:var(--ink2);margin-top:1px}
.pj .dist{font-size:11.5px;color:var(--ink3);white-space:nowrap;text-align:right}
.pjbtn{display:block;text-align:left;padding:0;color:inherit;width:100%}
.addb{background:var(--accent);color:var(--accent-ink);border-radius:8px;width:34px;height:34px;
  font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;line-height:1}
.addb.dis{background:var(--surf3);color:var(--ink2)}
/* already on this day — loud, because the whole point is spotting it in a long list */
.addb.got{background:var(--money);color:#fff;box-shadow:0 0 0 3px var(--money-soft);font-weight:800}
.mapbox{background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:7px;box-shadow:var(--shadow)}
svg{width:100%;height:auto;display:block}
.mapbox circle.hit{cursor:pointer}
/* Leaflet map (online) — the SVG below it is the offline fallback */
#lmap{height:clamp(320px,60vh,560px);border-radius:8px;overflow:hidden;background:var(--surf2)}
#lmap.hide,#map.hide{display:none}
.leaflet-container{font-family:inherit;font-size:12px}
/* the global svg{width:100%;height:auto} rule (for the drawn fallback map) would collapse
   Leaflet's overlay svg to 0×0 and clip every dot and route line — restore the default */
.leaflet-overlay-pane svg{width:auto;height:auto}
.leaflet-container a{color:var(--accent)}
.leaflet-tooltip{font-size:11.5px;padding:4px 7px}
/* Ninja‑360 branded pins — geometry and colours from the "Ninja‑360 Branded Map Pins" design */
.npx{background:none;border:0}
.npin{display:flex;flex-direction:column;align-items:center;width:26px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.45));cursor:pointer}
.npin .head{position:relative;width:26px;height:26px;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 30% 25%,var(--l),var(--b) 55%,var(--d) 100%)}
.npin .tail{width:13px;height:26px;margin-top:-9px;z-index:1;clip-path:polygon(50% 100%,0 0,100% 0);
  background:radial-gradient(circle at 30% 0%,var(--l),var(--b) 55%,var(--d) 100%)}
.npin.sel{width:52px;filter:drop-shadow(0 7px 10px rgba(0,0,0,.5))}
.npin.sel .head{width:52px;height:52px;box-shadow:0 0 0 5px var(--r);
  background:radial-gradient(circle at 30% 25%,var(--l),var(--b) 45%,var(--d) 100%)}
.npin.sel .tail{width:26px;height:42px;margin-top:-17px;
  background:radial-gradient(circle at 30% 0%,var(--l),var(--b) 45%,var(--d) 100%)}
.npin.sel.late .head{box-shadow:0 0 0 5px rgba(162,53,42,.65)}   /* not in the design: store shuts before you arrive */
.npin .disc{position:absolute;inset:14%;border-radius:50%;background:#fff;border:2px solid var(--a);box-sizing:border-box;
  display:flex;align-items:center;justify-content:center}
.npin .ini{font:800 15px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--b);letter-spacing:-.02em}
.npin .nmark{width:80%;height:80%;object-fit:contain;display:block}
.npin .nsym{width:80%;height:80%;display:block}
.ndot{position:relative;width:22px;height:22px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 30% 25%,var(--l),var(--b) 55%,var(--d) 100%);box-shadow:0 2px 5px rgba(0,0,0,.4)}
.nbadge{position:absolute;left:100%;top:-4px;margin-left:-8px;z-index:3;display:flex;border-radius:16px;overflow:hidden;white-space:nowrap;
  box-shadow:0 3px 8px rgba(0,0,0,.4);font:800 13px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.nbadge .dn{background:radial-gradient(circle at 30% 25%,#ffcf8a,#f7941d 55%,#c95f00 100%);padding:6px 9px;color:#fff}
.nbadge .lf{background:#2b2e36;padding:6px 9px;color:#c7cad0}
.ndot .nbadge{top:-8px;transform:scale(.8);transform-origin:left top}
.ndot.sm{width:12px;height:12px;box-shadow:0 1px 3px rgba(0,0,0,.4)}   /* state-level zoom — not in the design */
/* Selected pin at region / state zoom — smaller so a day's stops don't clump into one blob */
.npin.sel.sel-m{width:44px}
.npin.sel.sel-m .head{width:44px;height:44px;box-shadow:0 0 0 4px var(--r)}
.npin.sel.sel-m .tail{width:22px;height:36px;margin-top:-15px}
.npin.sel.sel-m .ini{font-size:13px}
.npin.sel.sel-s{width:36px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.45))}
.npin.sel.sel-s .head{width:36px;height:36px;box-shadow:0 0 0 3px var(--r)}
.npin.sel.sel-s .tail{width:18px;height:30px;margin-top:-13px}
.npin.sel.sel-s .ini{font-size:11px}
.npin.sel.sel-s .nbadge{top:-6px;transform:scale(.8);transform-origin:left top}
/* on-site timer chips: only show once a timer has actually run */
.live-timer.idle{display:none}
/* start / end / home — not in the design; kept in the badge's dark‑pill language */
.lnum{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
  background:#2b2e36;color:#fff;font:800 11px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.lnum.home{background:#fff;color:#2b2e36;border-color:#2b2e36;font-size:13px}
/* home base — the Ninja mark itself, so it reads at a glance among 180 store pins */
.homepin{width:34px;height:34px;border-radius:50%;background:#fff;border:2.5px solid var(--accent);
  box-shadow:0 2px 8px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;overflow:hidden}
.homepin img{width:88%;height:88%;object-fit:contain;display:block}
/* you are here — Google's white car puck, so the one moving thing on the map reads instantly */
.carpin{width:30px;height:30px;border-radius:50%;background:#fff;color:#2b2e36;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--accent);box-shadow:0 3px 10px rgba(0,0,0,.5)}
.carpin svg{width:64%;height:64%;display:block}
/* real chargers, pulled from Open Charge Map — distinct blue so they never read as a job */
.chgx{background:none;border:none}
.chg{width:22px;height:22px;border-radius:7px;background:var(--b);color:var(--a);display:flex;align-items:center;justify-content:center;
  font:800 10px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:-.03em;border:1.5px solid var(--ring,#fff);box-shadow:0 2px 5px rgba(0,0,0,.35);cursor:pointer}
.chg svg{width:66%;height:66%;display:block}
.chg .ini{transform:translateY(.5px)}
.chg.c{width:26px;height:26px;border-radius:8px;font-size:10.5px}    /* city zoom: the network's letters */
.chg.md{width:16px;height:16px;border-radius:5px;border-width:1.25px}
.chg.sm{width:11px;height:11px;border-radius:3px;border-width:1px;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.chg.ts{box-shadow:0 0 0 2px #FF8D2D,0 2px 6px rgba(0,0,0,.35)}      /* truck stop at an interstate exit: orange halo */
.chg{position:relative}
.chg.fav{box-shadow:0 0 0 2px #FFC220,0 0 10px rgba(255,194,32,.75),0 2px 6px rgba(0,0,0,.35)}   /* favorite: gold halo outside the brand ring */
.chg.c{border-width:2px}   /* up close the brand ring reads — IONNA's orange pinstripe */
.chg .star{position:absolute;top:-8px;right:-8px;font-size:12px;line-height:1;color:#FFC220;text-shadow:0 1px 2px rgba(0,0,0,.55);font-style:normal}
.chg.md .star{top:-7px;right:-7px;font-size:10px}
.leg .ci.fav{box-shadow:0 0 0 1.5px #FFC220}
/* runs — whole trips, one tap */
.zrow{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 2px}
.zchip{text-align:left;padding:6px 10px;border:1px solid var(--line2);border-radius:10px;background:var(--surf2);
  color:var(--ink);font-size:13px;font-weight:600;line-height:1.25}
.zchip small{display:block;font-weight:400;font-size:11px;color:var(--ink3)}
.zchip.mid{border-style:dashed}
.zchip.thin{opacity:.62}
.zchip.on{border-color:var(--accent);background:var(--accent-soft);border-style:solid}
.runs{display:flex;flex-direction:column;gap:6px}
.runbtn.bind b{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.bindline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px;padding:7px 11px;
  border:1px solid var(--line2);border-radius:10px;background:var(--surf2)}
.bindline b{font-size:13.5px}
.tm .bk{color:var(--money);font-weight:700;font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.bindline button{padding:4px 9px;min-height:28px;font-size:12px}
.runbtn{text-align:left;padding:9px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--surf2);color:var(--ink);font-size:14px}
.runbtn small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.runbtn.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft,rgba(244,121,32,.25)) inset}
.leg .ci{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;margin-right:5px;
  background:var(--b);color:var(--a);font:800 7.5px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;border:1px solid var(--ring,#fff);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.leg .ci.ts{box-shadow:0 0 0 1.5px #FF8D2D}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--ink2);margin-top:6px;align-items:center}
.leg i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:-1px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(7,1fr);z-index:1100;padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:8px 2px 9px;font-size:10.5px;font-weight:600;color:var(--ink3);
  display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--accent)}
nav .ic{font-size:16px;line-height:1}
nav .dotN{position:absolute;top:4px;right:calc(50% - 22px);background:var(--accent);color:var(--accent-ink);
  border-radius:9px;font-size:9px;padding:0 4px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));background:var(--head-bg);color:var(--head-ink);
  padding:9px 15px;border-radius:9px;font-size:13px;z-index:1180;box-shadow:var(--shadow);max-width:88vw;
  display:flex;gap:12px;align-items:center}
.toast button{color:#FFB27A;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.6px;padding:2px 0}
.empty{color:var(--ink3);font-size:13.5px;padding:16px 2px;text-align:center}
.note{font-size:12.5px;color:var(--ink2);margin:7px 0}
.hint{font-size:12px;color:var(--ink3);margin:4px 0 9px}
/* paste panels: add jobs / add places */
.cj summary{cursor:pointer;list-style:none;user-select:none}.cj summary::-webkit-details-marker{display:none}
.cj textarea{width:100%;box-sizing:border-box;min-height:88px;font:inherit;font-size:12.5px;line-height:1.35;padding:8px;
  border:1px solid var(--line);border-radius:9px;background:var(--surf2);color:var(--ink);white-space:pre;overflow-x:auto}
.cj input{font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surf2);color:var(--ink);min-height:36px}
.cj .pj{display:flex;gap:8px;align-items:center;margin-top:6px}
pre.req{background:var(--surf2);border:1px solid var(--line);border-radius:9px;padding:10px;
  font-size:11.5px;white-space:pre-wrap;word-break:break-word;max-height:290px;overflow:auto;margin:0}
.chk{width:19px;height:19px;accent-color:var(--accent)}
.seg{display:flex;gap:3px;background:var(--surf3);padding:3px;border-radius:9px;margin-bottom:9px}
.seg button{flex:1;padding:7px 4px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:var(--shadow)}
.clus{border-left:3px solid var(--money)}
table.pl{width:100%;border-collapse:collapse;font-size:13px}
table.pl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);
  padding:5px 6px;border-bottom:1px solid var(--line)}
table.pl td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.npin.ret .head{box-shadow:0 0 0 3px #8B2FC9,0 0 0 5px rgba(139,47,201,.35)}
.ndot.ret{box-shadow:0 0 0 2px #8B2FC9,0 0 0 4px rgba(139,47,201,.35)}
/* scoreboard */
table.pl [data-shot]{min-height:40px;min-width:62px;font-weight:700;letter-spacing:.3px}
table.pl [data-shot]:not(.go){border-color:var(--accent);color:var(--accent)}
.sb-hero{text-align:center;padding:15px 13px 13px}
.sb-big{font-size:46px;font-weight:700;letter-spacing:-1.5px;line-height:1;color:var(--money);margin:3px 0 2px}
.sb-sub{font-size:13px;color:var(--ink2);margin-bottom:9px}
.bar2{height:9px;background:var(--surf3);border-radius:5px;overflow:hidden}
.bar2 span{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .35s ease}
.sb-belt{margin-top:9px;font-size:12.5px;color:var(--ink2);letter-spacing:.2px}
/* the Verizon scoreboard: a pie on the left, three big numbers on the right, one legend line under */
.vz{border-top:3px solid var(--vz)}
.vz .lab{color:var(--vz)}
.vzrow{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 2px}
.vzpiewrap{position:relative;flex:0 0 auto}
.vzpie{width:144px;height:144px;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.12))}
.vzpct{position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
  background:var(--vz);color:#fff;font:800 13px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:-.2px;
  padding:3px 11px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.28);border:2px solid var(--surf)}
.vzsb{display:grid;grid-template-columns:auto auto;column-gap:10px;row-gap:2px;align-items:baseline;text-align:left}
.vzsb b{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1.05;color:var(--ink)}
.vzsb b.red{font-size:48px;color:var(--vz);letter-spacing:-2px}
.vzsb b.dim{font-size:22px;color:var(--ink3)}
.vzsb span{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink2)}
.vzleg{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:15px;color:var(--ink2)}
.vzleg b{color:var(--ink);font-weight:700}
.vzleg i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px;border:1px solid var(--line2)}
.vzowed{margin-top:6px;font-size:15px;color:var(--ink2)}
.vzowed b{color:var(--vz);font-weight:700}
/* the bar: one line, always closed until he asks */
.livebtn{display:block;width:100%;margin:9px 0 0;padding:15px 16px;border:0;border-radius:13px;
  background:linear-gradient(135deg,#F47920,#D8600F);color:#fff;font-size:19px;font-weight:800;
  letter-spacing:.4px;text-align:center;box-shadow:0 4px 14px rgba(244,121,32,.35);min-height:64px}
.livebtn small{display:block;font-weight:400;font-size:12px;letter-spacing:0;opacity:.92;margin-top:3px}
.livebtn:active{transform:scale(.985)}
.livestrip{display:flex;align-items:center;gap:8px;width:100%;margin:9px 0 0;padding:7px 11px;
  border:1px solid var(--money);border-radius:10px;background:rgba(44,107,79,.08);
  color:var(--ink);font-size:13.5px;text-align:left;min-height:38px}
.livestrip b{color:var(--money);letter-spacing:.6px}
.livestrip .gbchev{color:var(--money)}
.livemeta{flex:1;color:var(--ink2);font-size:12px}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--money);flex:none;
  box-shadow:0 0 0 3px rgba(44,107,79,.22);animation:livepulse 2.4s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.45}}
.gbbar{display:flex;align-items:center;gap:8px;width:100%;margin:9px 0 0;padding:7px 11px;
  border:1px solid var(--ret);border-radius:10px;background:rgba(139,47,201,.07);
  color:var(--ink);font-size:13.5px;text-align:left;min-height:38px}
.gbbar b{font-weight:700}
.gbbar.on{border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
.gbmeta{color:var(--ink2);font-size:12px;flex:1}
.gbchev{color:var(--ret);font-size:11px;flex:none}
.gbdot{width:7px;height:7px;border-radius:50%;background:var(--ret);flex:none;
  box-shadow:0 0 0 3px rgba(139,47,201,.22)}
.hrow{border:1px solid var(--line2);border-radius:10px;margin-bottom:7px;overflow:hidden;background:var(--surf)}
.htog{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;background:none;border:0;
  color:var(--ink);text-align:left;min-height:44px}
.hleft{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hleft b{font-size:14px}
.hsub{font-size:11.5px;color:var(--ink3)}
.hpts{color:var(--money);font-size:14px}
.hbody{padding:0 12px 10px;border-top:1px solid var(--line)}
.hroute{font-size:11.5px;color:var(--ink2);padding:8px 0 2px}
.hstop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:5px 0;border-top:1px solid var(--line)}
.hstop:first-of-type{border-top:0}
.hstop .pjbtn{flex:1;min-width:140px;text-align:left;padding:0;background:none;border:0}
.hmeta{font-size:11px;color:var(--ink3)}
.unbilled{border-left:3px solid var(--warn)}
.unbilled .lab{color:var(--warn)}
.ubrow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:5px 0;border-top:1px solid var(--line)}
.ubrow:first-of-type{border-top:0}
.ubrow .pjbtn{flex:1;min-width:150px;text-align:left;padding:0;background:none;border:0}
.ubmeta{font-size:11.5px;color:var(--ink3)}
.ubp{color:var(--warn);font-size:13px}
.runhead{border-left:3px solid var(--accent)}
.rh-name{font-size:17px;font-weight:800;letter-spacing:-.2px;margin-top:2px}
.rh-sub{font-size:12.5px;color:var(--ink2);margin-top:3px}
.runrow.done .nm{opacity:.75}
.gbcard{border:1px solid var(--ret);border-top:0;border-radius:0 0 10px 10px;margin-top:0;
  background:linear-gradient(180deg,rgba(139,47,201,.05),transparent 60%)}
.gbrow{border-top:1px solid var(--line)}
.gbrow:first-of-type{border-top:0}
.gbtog{display:flex;align-items:center;gap:8px;width:100%;padding:7px 2px;background:none;
  border:0;color:var(--ink);font-size:13.5px;text-align:left;min-height:36px}
.gbn{flex:1;font-weight:600}
.gbmi{color:var(--ink3);font-size:11.5px}
.gbbody{padding:0 2px 8px}
.gblist{margin:5px 0 6px;padding-left:18px;font-size:12.5px;color:var(--ink2)}
.gblist li{margin:2px 0}
.gblist li.got{text-decoration:line-through;opacity:.5}
.bestwk{border-left:3px solid var(--money)}
.bw-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:2px 0 8px}
.bw-pts{font-size:30px;font-weight:800;letter-spacing:-.6px;color:var(--money);line-height:1}
.bw-when b{font-size:14px;display:block}
.bw-when div{font-size:12.5px;color:var(--ink2)}
.bw-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.bw-n{font-size:21px;font-weight:700;letter-spacing:-.3px;line-height:1.1}
.bw-sub{font-size:11.5px;color:var(--ink3);margin-top:1px}
.bw-cities{display:flex;flex-wrap:wrap;gap:4px;padding-top:8px;border-top:1px solid var(--line)}
.bw-cities span{font-size:11.5px;padding:2px 7px;border-radius:999px;background:var(--surf2);
  border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:9px 0 4px}
.daycol{text-align:center}
.daycol.today .dlab{color:var(--accent);font-weight:700}
.dbar{height:52px;display:flex;align-items:flex-end;justify-content:center;gap:2px;
  background:var(--surf2);border:1px solid var(--line);border-radius:6px;padding:3px}
.dbar span{width:9px;border-radius:2px 2px 0 0;min-height:2px}
.dbar .plan{background:var(--line2)}
.dbar .got{background:var(--money)}
.dlab{font-size:10px;color:var(--ink3);margin-top:3px;font-weight:600}
.dpts{font-size:10.5px;color:var(--money);font-weight:700;min-height:13px}
@media (prefers-reduced-motion:reduce){.bar2 span{transition:none}}
/* bottom sheet */
/* Leaflet's panes and controls sit at 400–1000: everything fixed over the map lives above that */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:1170}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1171;background:var(--surf);
  border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:none;
  box-shadow:0 -8px 30px rgba(0,0,0,.18);max-height:78vh;overflow:auto;
  padding:8px 15px calc(16px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:2px auto 10px}
.sheet.tall{max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch}
/* the Philosophy — three lanes */
.oath-crest{display:flex;align-items:center;gap:14px;padding:10px 4px 14px;border-bottom:1px solid var(--line)}
.oath-crest img{width:84px;height:84px;border-radius:50%;object-fit:cover;background:#111;flex:none;
  border:2px solid var(--accent);box-shadow:0 3px 10px rgba(0,0,0,.3)}
.oath-crest b{display:block;font-size:17px;line-height:1.2;margin-top:1px}
.oath-crest .cr{font-size:13px;color:var(--ink2)}
.oath .ph{position:relative;border-left:3px solid var(--accent);padding:7px 44px 8px 14px;margin:10px 0;background:var(--surf2);border-radius:0 10px 10px 0}
.oath .phn{position:absolute;right:12px;top:8px;font:800 12px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--accent);letter-spacing:.1em}
.oath h4{margin:0 0 2px;font-size:16px;line-height:1.15}
.oath .lead{font-size:13px;color:var(--ink2);margin:0 0 6px}
.oath ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink2)}
.oath li{margin:2px 0}
.oath-daily{margin:14px 0 0;padding:10px 14px;border-radius:10px;background:var(--surf2);font-size:14px;line-height:1.5}
.oath-daily .lab{margin-bottom:4px}
.oath-daily .fs{font-weight:800;font-size:16px;margin-top:4px;color:var(--accent)}
.oath-ask{margin:14px 0 8px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;text-align:center}
.oath-ask b{display:block;font-size:16px;margin-bottom:2px}
.oath-ask div{font-size:13px;color:var(--ink2)}
.oath-yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oath-yn button{min-height:48px;font-size:16px;font-weight:700}
/* the gate — between the app (below) and the sheet (above) */
#gate{position:fixed;inset:0;z-index:1160;background:radial-gradient(900px 600px at 50% 30%,#2a1c0e,#141210 70%);color:#f2eae0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#gate img{width:min(64vw,300px);height:auto;filter:drop-shadow(0 12px 28px rgba(0,0,0,.65))}
#gate .gt{font:800 24px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:.01em}
#gate .gd{font-size:15px;line-height:1.55;max-width:340px}
#gate .gd .lab{color:#FABB7C;margin-bottom:4px}
#gate .gd .fs{font-weight:800;font-size:18px;color:#F47920;margin-top:6px}
#gate .gc{font-size:14px;opacity:.8}
#gate button{background:transparent;color:#f2eae0;border:1px solid rgba(242,234,224,.45);margin-top:4px;padding:10px 18px;font-weight:700}
.sheet h3{font-size:15px;margin-bottom:2px}
.sheet .shsub{font-size:12px;color:var(--ink2);margin-bottom:10px}
.shlist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.shbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;
  border:1px solid var(--line2);border-radius:9px;padding:11px 12px;font-size:13.5px;font-weight:600;background:var(--surf2)}
.shbtn small{color:var(--ink3);font-weight:400}
.shbtn.danger{color:var(--bad);border-color:var(--bad)}
.shbtn.cur{border-color:var(--accent);background:var(--accent-soft)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .18s ease-out}
  .sheet{animation:up .2s ease-out}
  .scrim{animation:fade .2s ease-out}
}
@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* scoreboard: players + drive */
.plyrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-bottom:10px}
.plyr{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
.plyr img{width:88px;height:88px;flex:none;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.plyr .pnm{font-size:17px;font-weight:800}
.plyr .pnm small{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin-left:4px}
.plyr .lab{margin-top:6px}
.plyr .pv{font-size:34px;font-weight:700;line-height:1.05;color:var(--pc);letter-spacing:-1px}
.plyr .pwk{font-size:12.5px;color:var(--ink2)} .plyr .pwk b{color:var(--ink)}
.drv{border-top:3px solid var(--accent)}
.drvh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.drvh .lab{color:var(--accent)}
.drvt{font-size:14px;color:var(--ink2);font-weight:600} .drvt b{font-size:28px;color:var(--accent)}
.dmap{background:var(--surf2);border-radius:10px;overflow:hidden}
.dmap svg{display:block;width:100%;height:auto}
.dmap .dpin{cursor:pointer}
.dmap .dnum{font:700 14px "IBM Plex Mono",ui-monospace,monospace;fill:#fff}
.dmap .dtown{font:600 19px Archivo,sans-serif;fill:var(--ink);stroke:var(--surf2);stroke-width:5px;paint-order:stroke}
.drvdays{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:10px}
.drvdays>div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.drvdays i{width:20px;height:5px;border-radius:3px}
.drvdays span{display:flex;flex-direction:column;font-size:13.5px} .drvdays small{color:var(--ink3);font-size:11.5px}
.drvdays>div>b{font-size:17px}
.runpick{display:block;width:100%;max-width:100%;margin:12px 0 10px;padding:11px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--surf2);color:var(--ink);font:600 14px Archivo,-apple-system,sans-serif}
.sbmore{margin:14px 0 4px}
.sbmore>summary{cursor:pointer;list-style:none;border:1px solid var(--line2);border-radius:10px;padding:11px 14px;font-weight:600;font-size:13.5px;color:var(--ink2);background:var(--surf2)}
.sbmore>summary::-webkit-details-marker{display:none}
.sbmore>summary::after{content:" ▾";color:var(--ink3)}
.sbmore[open]>summary{margin-bottom:10px}
.sbmore[open]>summary::after{content:" ▴"}
</style>

const shot=id=>{ const j=BY[id];

/* A point is TRUE when the location is LOCKED — Tim was there, it is shot, it counts.
   Two ways a job is locked:
     1. S.locks[id] — somebody tapped SHOT in the field. {d:'YYYY-MM-DD', pts, by, with, at, sd}
        (d = the day it counts against; at = the clock when tapped; sd = that device's calendar day
        at the tap, so a lock dated after its own day can be told apart in any timezone)
     2. IDS already banked it (st Complete/Invoiced/Return Owed) — implied lock, dated j.dt.
   Un-marking a shot leaves a tombstone in S.unshot[id]={at,by}: a later un-shot beats an earlier
   lock on merge, and a later re-shot beats the tombstone. LOCK PLAN (lockPlan) is a different act.
   Everything on the Scoreboard derives from this one definition. S.status (the old

const IDSLOCK=j=>j.st==='Complete'||j.st==='Invoiced'||j.st==='Return Owed';

const planDayOf=id=>S.days.find(x=>x&&x.locked&&Array.isArray(x.ids)&&x.ids.includes(id))||null;

// button: on the last day of a multi-day trip he catches up marking Friday's and
// Saturday's stops done while driving home Sunday, and every one of them would land on
// Sunday if this used the clock. It uses the day the stop is actually parked on instead --
// the route he ran that day is the ground truth of when he shot it -- and falls back to
// today's real date only for a stop that is not on any planned day at all.
function lockJob(id,on){
  const j=BY[id]; if(!j)return;
  S.locks=S.locks||{}; S.unshot=S.unshot||{};
  if(on){const n=new Date(), today=ymd(n);
    const dd=shotDayOf(id);
    const d=(dd&&dd.date&&dd.date<=today)?dd.date:today;   // the day it sits on — never a day that has not come

// un-marking is a fact with a time on it, or a crew merge would hand the lock straight back
function unshotJob(id){ S.unshot=S.unshot||{}; if(S.locks&&S.locks[id])S.unshot[id]={at:Date.now(),by:S.who||''}; if(S.locks)delete S.locks[id]; }

const stampDay=l=>(l&&l.sd)||ymd(new Date(l.at));

/* Which of a stop's days is it being shot on? Today's, if it is on today's; otherwise the latest
   day that has already come (a stop carried over from a missed day is dated when it was shot, not
   when it was first planned); only then a day still ahead. */
function shotDayOf(id){
  const today=ymd(new Date()), all=S.days.filter(x=>x&&Array.isArray(x.ids)&&x.ids.includes(id));
  if(!all.length)return null;
  const dated=all.filter(x=>x.date), t=dated.find(x=>x.date===today); if(t)return t;

/* A lock dated AFTER the day it was written is a plan being locked in, not a store being shot —
   nobody shoots Thursday's stops on Tuesday. The old LOCK button made these; the new build cannot.
   Turn each into what was meant: the day becomes a locked plan, the stop is PLANNED again, its
   points come off the board. Runs on boot and after every crew merge, so a phone still on the old
   build cannot put them back. */
function convertFutureLocks(){
  let n=0;
  Object.entries(S.locks||{}).forEach(([id,l])=>{
    if(!BY[id]||!futureLock(l))return;
    const d=S.days.find(x=>x.date===l.d&&Array.isArray(x.ids)&&x.ids.includes(id));
    if(d&&!d.locked&&!(d.unlocked&&d.unlocked.at>l.at))d.locked={at:l.at,by:l.by||''};
    delete S.locks[id]; if(S.status[id]==='captured')delete S.status[id]; delete S.by[id]; n++;

const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
/* every lock, newest first */
function allLocks(){
  const out=[];
  J.forEach(j=>{const l=lockOf(j.id); if(l)out.push({id:j.id,j,...l});});

function weekTarget(a,b){const A=ymd(a),B=ymd(b);const seen=new Set();let t=0;

    d.ids.forEach(i=>{const j=BY[i],l=lockOf(i);if(l&&l.d&&l.d<A)return;   // a return visit to a stop banked earlier commits nothing new

// One place sets status, so the attribution, the lock and the Scoreboard always follow it.
//
// In the car he does ONE thing: check it off. That has to mean all of it — the stop reads
// done on every tab including Planning, the pin turns green on the map, and the points
// land on the Scoreboard. So a status of anything but "todo" locks the job, and checking
// it back off unlocks it again. An IDS-implied lock is never touched: those are their
// facts, not ours, and lockJob only ever writes and deletes S.locks[id].
function setStatus(id,st){
  const j=BY[id];
  if(!st||st==='todo'){delete S.status[id]; delete S.by[id];
    if(S.locks&&S.locks[id])lockJob(id,false);   // the point comes back off the board too
    return}
  const was=done(id); S.status[id]=st;
  if(!was||!S.by[id]){ if(S.who)S.by[id]=S.who; }   // first mark-done stamps the shooter; a status bump later keeps it
  if(j&&!j.wp&&!(S.locks&&S.locks[id]))lockJob(id,true);

/* ---------- SHOT: the one act in the field ----------
   One button, one meaning: the stop is done. It banks the points, turns the pin green, drops
   off the live route, and takes its onsite date from the day it is parked on. Locking a PLAN
   is a different act (lockPlan, below) and banks nothing — that is the whole fix.
   Guard: a stop parked on a day that has not come yet is being shot early — he ran ahead, or
   a thumb slipped. Ask; and if it really is shot, date it today, not the planned day. */
function markShot(id,on){
  const j=BY[id]; if(!j)return false;
  const ours=!!((S.locks&&S.locks[id])||done(id));
  if(!on&&!ours&&!j.wp&&IDSLOCK(j)){toast(j.st==='Return Owed'?'Nothing to undo — the revisit has not been shot':'IDS has this one banked — nothing of ours to undo');return false}
  // every way in — the stop card, the Run tab, the Score table, the status dropdown — meets the go-back list here
  if(on&&!j.wp&&GOBACK(id)){toast('Go-back list still open — '+punchLeft(id)+' left. Tick it off first');return false}
  if(on&&!j.wp){
    const dd=shotDayOf(id), today=todayISO();
    if(dd&&dd.date&&dd.date>today){
      if(!confirm(j.n+' is planned for '+niceDate(dd.date)+'. Mark it SHOT today, '+niceDate(today)+'?'))return false;
      setStatus(id,'captured'); if(S.locks[id])S.locks[id].d=today;
      afterFieldMark(id); return true;
    }
  }
  setStatus(id,on?'captured':'todo'); afterFieldMark(id); return true;
}
/* Undo puts back exactly what was there — the same lock, date and shooter, and the stop's place in
   every day it sits on — so an undo never re-asks the question and never re-dates anything. The
   restored lock is re-stamped with the clock (its date stays), so it outlives the un-shot tombstone. */
const shotSnap=id=>({lock:(S.locks&&S.locks[id])?Object.assign({},S.locks[id]):null,status:S.status[id],by:S.by[id],
  orders:S.days.filter(d=>d&&Array.isArray(d.ids)&&d.ids.includes(id)).map(d=>({date:d.date,ids:d.ids.slice()}))});
function shotRestore(id,s){
  if(s.lock)S.locks[id]=Object.assign({},s.lock,{at:Date.now()}); else unshotJob(id);
  if(s.status)S.status[id]=s.status; else delete S.status[id];
  if(s.by)S.by[id]=s.by; else delete S.by[id];
  // the same set of stops as when the snapshot was taken — an add or remove made in between is kept
  (s.orders||[]).forEach(o=>{const d=S.days.find(x=>x&&x.date===o.date&&Array.isArray(x.ids));
    if(d&&d.ids.length===o.ids.length&&o.ids.every(i=>d.ids.includes(i)))d.ids=o.ids.slice()});
  afterFieldMark(id);
}

/* ---------- LOCK PLAN: commit a day ----------
   A plan is a date and a list. Locking it names the route (the binding), marks every stop on it
   PLANNED, and freezes the list — no add, remove, move, reorder or date change until it is
   unlocked. Nothing is banked; the drive and the clock stay live. */
function lockPlan(d,on){

    if(!d.date){toast('Set the date first — a plan is a date and a list');return false}
    if(!d.ids.length){toast('Put some stops on the day first');return false}
    d.locked={at:Date.now(),by:S.who||''}; d.unlocked=null; bindRoute(d,true);
  } else { d.locked=null; d.unlocked={at:Date.now(),by:S.who||''}; }   // the unlock is a fact too — it survives a crew merge
  return true;
}

/* ---------- Google Maps: whole-day route ---------- */
function gmapsPoint(k){
  if(k&&k.startsWith('job:')){const j=BY[k.slice(4)];return j?(j.a+', '+j.c+', '+j.s):null}
  if(PLACES[k]&&PLACES[k].a)return PLACES[k].a;      // a custom place navigates by its address
  const ll=placeLL(k);return ll[0].toFixed(5)+','+ll[1].toFixed(5);
}
// Directions that route through a fast charger near the stop first — Google resolves
// the free-text waypoint to a real nearby station. No API key, no origin (Maps uses
// wherever you're standing), just a waypoint ahead of the destination.
function chargerDirUrl(j){
  // a favorite network (IONNA) we already know about within 15 mi beats a generic search
  let way='EV fast charging station near '+j.c+', '+j.s, best=null;
  if(typeof CLIST!=='undefined')CLIST.forEach(p=>{const a=p.AddressInfo; if(!a||!chgBrand(p).fav||!isFinite(a.Latitude))return;
    const d=mi(LL(j),[a.Latitude,a.Longitude]); if(d<=15&&(!best||d<best.d))best={d,a}});
  if(best)way=best.a.Latitude.toFixed(5)+','+best.a.Longitude.toFixed(5);
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving'
    +'&waypoints='+encodeURIComponent(way)
    +'&destination='+encodeURIComponent(j.a+', '+j.c+', '+j.s);
}
function dayRouteUrls(d){
  const stops=d.ids.filter(id=>BY[id]).map(id=>BY[id].a+', '+BY[id].c+', '+BY[id].s);
  if(!stops.length)return[];
  // points = every stop plus the end place; each URL takes origin + up to 9 waypoints + 1 destination
  const points=stops.concat([gmapsPoint(d.endKey)]);
  const urls=[]; let origin=gmapsPoint(d.startKey);
  while(points.length){
    const chunk=points.splice(0,10);
    const dest=chunk[chunk.length-1], way=chunk.slice(0,-1);
    urls.push('https://www.google.com/maps/dir/?api=1&travelmode=driving'
      +'&origin='+encodeURIComponent(origin)
      +(way.length?'&waypoints='+encodeURIComponent(way.join('|')):'')
      +'&destination='+encodeURIComponent(dest));
    origin=dest;
  }
  return urls;
}
function openDayRoute(d){
  const urls=dayRouteUrls(d);
  if(!urls.length){toast('No stops on this day yet');return}
  if(urls.length===1){window.open(urls[0],'_blank','noopener');return}
  sheet('Route in two legs','Google Maps takes 10 stops at a time.',
    '<div class="shlist">'+urls.map((u,i)=>'<button class="shbtn" data-leg="'+i+'">Leg '+(i+1)+' <small>opens in Maps</small></button>').join('')+'</div>',
    el=>{urls.forEach((u,i)=>{el.querySelector('[data-leg="'+i+'"]').onclick=()=>window.open(u,'_blank','noopener')})});
}

function reachable(){
  const d=day(), here=placeLL(S.here.key), t0=S.here.time;
  const a=assigned();
  const pool=unscheduled().concat(J.filter(j=>NEEDSVISIT(j)&&a[j.id]===S.active));
  const seen=new Set();
  return pool.filter(j=>{if(seen.has(j.id))return false;seen.add(j.id);return true})
    .map(j=>{const m=mi(here,LL(j)), dt=drive(m);
      const arr=Math.max(t0+dt,j.o), fin=arr+svc(j);
      return {j,m,dt,arr,fin,ok:fin<=j.x,rate:j.p/(dt+svc(j)),inday:d.ids.includes(j.id)}})

}

function wireStops(){

  // anywhere (a list cleared, a stop added after the shot ones), so a row index is not an ids index
  const move=(id,dir)=>{ if(dayLocked(d)){lockedToast();return}
    const order=simulate(d).rows.map(r=>r.id), i=order.indexOf(id), k=i+dir;
    if(i<0||k<0||k>=order.length)return;
    [order[i],order[k]]=[order[k],order[i]];

    sinkDone(d); render(); dirty()};

function sheet(title,sub,bodyHTML,wire){
  closeSheet();

  const sc=document.createElement('div');sc.className='scrim';
  const sh=document.createElement('div');sh.className='sheet';
  sh.setAttribute('role','dialog');sh.setAttribute('aria-label',title);sh.setAttribute('aria-modal','true');
  sh.innerHTML=`<div class="grab"></div><h3>${title}</h3>${sub?`<div class="shsub">${sub}</div>`:''}${bodyHTML}
    <div style="margin-top:12px"><button class="ghost" data-close style="width:100%">Close</button></div>`;
  document.body.append(sc,sh);sheetEls=[sc,sh];
  sc.onclick=closeSheet;sh.querySelector('[data-close]').onclick=closeSheet;
  document.addEventListener('keydown',escSheet);
  sh.addEventListener('keydown',e=>{
    if(e.key!=='Tab')return;
    const f=[...sh.querySelectorAll('button,input,select')].filter(x=>!x.disabled);
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  });
  if(wire)wire(sh);
  const f=sh.querySelector('button:not([data-close]),input,select');if(f)f.focus();
}

/* The pool is sorted by distance from the last stop on the day — so adding a stop moved the
   anchor and re-sorted everything under Tim's thumb. The order is now frozen per filter/day
   and only re-measured when he asks, so a row stays put while he works down the list. */
let POOL={key:'',ids:[],anchor:null,stale:false};
function renderPool(){
  const d=day(), a=assigned();
  const key=[S.active,d.date,F.q,F.st,F.cl,F.jst,F.app,F.sort].join('|');
  if(key!==POOL.key){POOL={key,ids:[],anchor:d.ids.length?LL(BY[d.ids[d.ids.length-1]]):placeLL(d.startKey),stale:false}}
  const anchor=POOL.anchor||placeLL(d.startKey);
  const liveAnchor=d.ids.length?LL(BY[d.ids[d.ids.length-1]]):placeLL(d.startKey);
  POOL.stale=mi(anchor,liveAnchor)>0.05;
  const q=F.q.toLowerCase();
  let list=J.filter(j=>{if(j.wp)return false;   // waypoints are added from "＋ Stop", not the pool
    if(F.st&&j.s!==F.st)return false;if(F.cl&&j.cl!==F.cl)return false;
    if(F.jst&&j.st!==F.jst)return false;
    if(F.app==='in'&&!S.loaded[j.id])return false;
    if(F.app==='out'&&S.loaded[j.id])return false;
    if(q&&!(j.n+' '+j.a+' '+j.c+' '+j.id).toLowerCase().includes(q))return false;return true});
  list.forEach(j=>{j._d=mi(anchor,LL(j));j._b=mi(BASE,LL(j))});
  list.sort((x,y)=>F.sort==='pay'?y.p-x.p||x._d-y._d:F.sort==='base'?x._b-y._b:x._d-y._d);
  if(POOL.ids.length){   // keep the order he is reading; anything new drops in at the end
    const rank={}; POOL.ids.forEach((id,i)=>rank[id]=i);
    list.sort((x,y)=>(rank[x.id]===undefined?1e6:rank[x.id])-(rank[y.id]===undefined?1e6:rank[y.id]));
  }
  POOL.ids=list.map(j=>j.id);
  $('#pool').innerHTML=list.slice(0,120).map(j=>{
    // "mine" is the direct question — is it on the day I am editing — not who assigned() happens
    // to report. A stop already on another day never lit its check before, which is precisely the
    // row Tim could not track.
    const mine=d.ids.includes(j.id), on=a[j.id]!==undefined&&!mine;

/* ---------- the zone map ----------
   Tim's cut. Missouri in five: NW, SW, NE, SE — and a fifth, Central, that sits in the
   middle and overlaps the other four. Kansas is cut the same way. The centre of each
   state is the crosshair; a stop inside the central radius belongs to Central and is
   named with the quadrant it overlaps, so the middle still reads as the middle without
   any stop being counted twice. Anything outside those two states groups by its state.

   Everything here reads from what is LEFT — unscheduled and still needing a visit — so
   the moment a stop is checked off or locked, it is out of the pool and the runs rebuild. */
const ZONES={
  MO:{name:'Missouri',c:[38.35,-92.44],r:85},
  KS:{name:'Kansas',  c:[38.50,-98.32],r:90}};
const QNAME={NW:'NW',NE:'NE',SW:'SW',SE:'SE'};
const STNAME={NE:'Nebraska',IA:'Iowa',IL:'Illinois',OK:'Oklahoma',AR:'Arkansas',AZ:'Arizona',
  CO:'Colorado',TX:'Texas',TN:'Tennessee',KY:'Kentucky',IN:'Indiana',IL_:'Illinois'};
function zoneOf(j){
  const z=ZONES[j&&j.s];
  if(!z||!isFinite(j.lat)){const s=(j&&j.s)||'';
    return{k:s||'ZZ',label:STNAME[s]||s||'Elsewhere',st:s,q:'',mid:false,ord:9}}
  const q=(j.lat>=z.c[0]?'N':'S')+(j.lon>=z.c[1]?'E':'W');
  if(mi(z.c,LL(j))<=z.r)return{k:j.s+'-C',label:'Central '+z.name,st:j.s,q,mid:true,ord:4};
  return{k:j.s+'-'+q,label:QNAME[q]+' '+z.name,st:j.s,q,mid:false,ord:{NW:0,SW:1,NE:2,SE:3}[q]};
}
// one legal day out of one zone's pool, seeded on the biggest payout still standing
function packDay(pool,seedJ,stretch){
  const far=mi(BASE,LL(seedJ))>95;
  const anchor=far?'job:'+seedJ.id:'home';   // far zones are overnights, run out of the zone itself
  const reach=(far?75:38)*(stretch||1), cap=(far?10.5:10)+(stretch>1?1.5:0);
  let d={id:'c',date:'',startKey:anchor,startTime:far?7.5:8,endKey:anchor,ids:[seedJ.id]};
  const rest=pool.filter(j=>j.id!==seedJ.id).sort((a,b)=>mi(LL(seedJ),LL(a))-mi(LL(seedJ),LL(b)));
  for(let n=0;n<rest.length;n++){
    const j=rest[n];
    if(mi(LL(seedJ),LL(j))>reach)continue;
    const cand={...d,ids:d.ids.concat(j.id)};
    cand.ids=autoOrder(cand);
    const s=simulate(cand);
    if(s.bad===0&&s.span<=cap) d=cand;
    if(d.ids.length>=10)break;
  }

function buildClusters(){

  // day. Zone totals count BOTH — that is what is out there — while the runs are built only
  // from the free ones, so "Make this a day" can never double-book a stop.
  const onDay=new Set(S.days.flatMap(d=>d.ids));
  const zones={};
  J.filter(NEEDSVISIT).forEach(j=>{const z=zoneOf(j);
    const zz=zones[z.k]=zones[z.k]||{z,jobs:[],parked:[],parkedPay:0,pay:0};

    .forEach(({z,jobs,parked,parkedPay,pay})=>{

      pool.sort((a,b)=>b.p-a.p||mi(BASE,LL(a))-mi(BASE,LL(b)));
      let {d,far}=packDay(pool,pool[0]);
      // a thin seed gets one more try with a wider net before it is called a loose end
      if(d.ids.length<MINRUN){const w=packDay(pool,pool[0],2.2); if(w.d.ids.length>d.ids.length){d=w.d;far=w.far}}
      const used=new Set(d.ids); pool=pool.filter(j=>!used.has(j.id));
      if(d.ids.length<MINRUN){loose.push(...d.ids); continue}
      const s=simulate(d);

      made++;

  allLocks().forEach(l=>{
    const b=bucket(l.d||'—');   // an em dash groups anything IDS banked with no onsite date on record
    b.pts+=l.pts; b.n++; b.rows.push(l);
    if(l.j&&!l.j.wp){b.cities.add(l.j.c+', '+l.j.s); b.states.add(l.j.s)}
    if(l.with&&CREW[l.with])b.mates.add(l.with);
  });
  // a return drive — Lincoln's go-back, the Gap — is a stop on the day it was driven, worth nothing twice.
  // The day's crew, miles (logged where the log has it) and hours come from the same drive Score shows.
  drivenDays().forEach(dd=>{
    const b=bucket(dd.date);
    dd.ids.forEach(id=>{ const l=lockOf(id); if(!l||l.d===dd.date)return;
      b.n++; b.rows.push({id,j:BY[id],d:dd.date,pts:0,ret:true,with:dd.day.crew||''}); b.cities.add(BY[id].c+', '+BY[id].s); b.states.add(BY[id].s) });
    dd.mates.forEach(x=>b.mates.add(x));

  });

    if(!a.d&&!b.d)return 0; if(!a.d)return 1; if(!b.d)return -1;   // no-date bucket sinks to the bottom

function weekBuckets(){

    const b=(m[k]=m[k]||{k,pts:0,n:0,days:new Set(),cities:new Set(),states:new Set(),mates:new Set()});
    b.pts+=l.pts; b.n++; b.days.add(l.d);
    if(l.j&&!l.j.wp){b.cities.add(l.j.c+', '+l.j.s); b.states.add(l.j.s)}

/* ---------- the scoreboard: the ninja, the players, the drive ----------
   Score opens on three things only: the Verizon ninja (how many done / left), the players
   (miles driven, miles with each crew mate) and a snapshot of this week's drive. Everything
   else — points, belts, records, the job list, CSV — sits one tap down under "Points & job list".
   Miles are the day as driven: start → the stops that were shot, in plan order → end,
   priced with the same mi() / ROAD factor the planner uses. A day with nothing shot drove nowhere. */
let BMORE=false, DMAP=false, RUNPICK='';   // the points accordion, the map screenshot and the past run he picked: they stay how he left them

function drivenDays(){
  const today=ymd(new Date());

  // Every shot stop lands on the day it was shot — the lock ledger's date, the same one History
  // reads — whether or not that day was ever planned in the app. A plan on that date lends its
  // route, order and crew; without one the day is home → the stops → home. A shot stop with no
  // date on record rides the last past plan day that carried it. Nothing lands on two days, and
  // nothing lands on a day that has not come yet.

  J.forEach(j=>{ if(j.wp||!shot(j.id))return; const l=lockOf(j.id); if(l&&l.d&&l.d<=today)add(l.d,j.id) });
  const undated={};
  plans.forEach(d=>d.ids.forEach(id=>{ const j=BY[id]; if(!j||j.wp||!shot(id))return; const on=(lockOf(id)||{}).d;
    if(!on)undated[id]=d.date;                        // the last past plan that carried it
    else if(on<d.date&&(dayLocked(d)||FROZEN.has(d.date)))add(d.date,id);   // a locked plan after the shoot is a return drive — Lincoln's go-back, the Gap
  }));
  Object.keys(undated).forEach(id=>add(undated[id],id));
  // a frozen or locked past day with nothing shot is still a day on the road — the drive up to Lincoln
  plans.forEach(d=>{ if((FROZEN.has(d.date)||dayLocked(d))&&!byDate[d.date])byDate[d.date]=[] });
  const far=ids=>ids.length?ids.reduce((m,id)=>mi(BASE,LL(BY[id]))>mi(BASE,LL(BY[m]))?id:m,ids[0]):null;
  const days=Object.keys(byDate).sort().map(date=>{
    const plan=plans.find(x=>x.date===date); let ids=byDate[date];
    if(plan){ const first=plan.ids.filter(id=>ids.includes(id)); ids=first.concat(ids.filter(id=>!first.includes(id))) }
    const day=plan?Object.assign({},plan,{ids}):Object.assign(blankDay(date),{ids});
    return {date,day,ids,plan:!!plan,far:far(ids)};
  });
  // an unplanned day whose far end is out of town did not drive home that night when the next
  // day or two is worked out of the same area: it sleeps at the far stop and starts there —
  // the way Wichita and Lincoln were driven. Decided before the route is ordered, because a
  // home-to-home loop would otherwise always finish at the stop nearest home.
  days.forEach((d,i)=>{ const n=days[i+1]; if(!n||d.plan||n.plan||!d.far||!n.far)return;
    const gap=(new Date(n.date+'T12:00:00')-new Date(d.date+'T12:00:00'))/864e5;
    if(gap>2||mi(BASE,LL(BY[d.far]))<=120||mi(LL(BY[d.far]),LL(BY[n.far]))>=120)return;
    d.day.endKey='job:'+d.far; n.day.startKey='job:'+d.far; });
  // home-to-home days are routed against the clock like any plan; a day that starts or ends at a
  // stop is walked nearest-first from where it starts, finishing at the stop it sleeps at
  const walk=(from,ids)=>{const rest=ids.slice(),out=[];let cur=from;while(rest.length){let k=0;
    for(let i=1;i<rest.length;i++)if(mi(cur,LL(BY[rest[i]]))<mi(cur,LL(BY[rest[k]])))k=i;
    const id=rest.splice(k,1)[0];out.push(id);cur=LL(BY[id])}return out};
  days.forEach(d=>{ if(d.plan||d.ids.length<2)return; const {startKey,endKey}=d.day;
    if(startKey==='home'&&endKey==='home'){ if(d.ids.length>2)d.day.ids=d.ids=autoOrder(d.day); return }
    const end=endKey.startsWith('job:')?endKey.slice(4):null;
    d.day.ids=d.ids=walk(placeLL(startKey),d.ids.filter(id=>id!==end)).concat(end?[end]:[]) });
  return days.map(d=>{
    const s=simulate(Object.assign({},d.day,{allLive:true}));
    const mates=new Set(); if(d.day.crew&&CREW[d.day.crew])mates.add(d.day.crew);
    d.ids.forEach(id=>{const l=lockOf(id); if(l&&l.with&&CREW[l.with])mates.add(l.with)});

  });
}
function driveMap(days){

  let lines='',pins='',ends='',n=0; const named=new Set(), endSeen=new Set(), pl=[];
  const towns=new Set(); days.forEach(d=>d.ids.forEach(id=>towns.add(BY[id].c)));
  const label=towns.size<=10;
  days.forEach((d,di)=>{const col=DRIVE_COL[di%DRIVE_COL.length];
    const route=[placeLL(d.day.startKey),...d.ids.map(id=>LL(BY[id])),placeLL(d.day.endKey)].map(P);
    lines+=`<polyline points="${route.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>`;
    d.ids.forEach(id=>{n++; const [x,y]=P(LL(BY[id]));
      // stops in the same strip mall share one pin: "1–2"
      const near=pl.find(q=>Math.hypot(q.x-x,q.y-y)<16);
      if(near)near.nums.push(n); else pl.push({x,y,col,id,nums:[n]})});
    [d.day.startKey,d.day.endKey].forEach(key=>{ if(endSeen.has(key))return; endSeen.add(key);

   phone, and the plan looks gone. This keeps one copy for the crew at /api/state.

   SHARED is the work — the plan, the ledger, the book. Everything else is personal to the
   device you are holding: who is signed in, which tab you are on, where you are standing.

   Locks are facts with a person and a time on them, so a merge unions them; an un-shot is a fact
   too (S.unshot), and on each stop the later of the two wins. Everything else is last-write-wins,

function mergeState(j){
  if(!j||!j.days||!j.days.length)return false;
  S.days=j.days; S.active=Math.min(j.active||0,j.days.length-1);
  S.activeDate=typeof j.activeDate==='string'?j.activeDate:'';
  if(S.activeDate){const k=S.days.findIndex(d=>d.date===S.activeDate); if(k>=0)S.active=k}
  S.sv=j.sv||{}; S.loaded=j.loaded||{}; S.status=j.status||{}; S.notes=j.notes||{}; S.timers=j.timers||{};
  S.punch=j.punch||{}; S.locks=j.locks||{}; S.showBanked=!!j.showBanked;
  S.here=j.here||{key:'home',time:8};
  S.nav=NAVS.includes(j.nav)?j.nav:'plan';
  S.custom=Array.isArray(j.custom)?j.custom:[];   // jobs pasted from email — not in the baked DATA
  S.places=(j.places&&typeof j.places==='object'&&!Array.isArray(j.places))?j.places:{};   // where Tim stays / starts
  S.lastRequest=(j.lastRequest&&j.lastRequest.at)?j.lastRequest:null;   // last "please load" sent to IDS
  S.evRange=(isFinite(j.evRange)&&j.evRange>=50)?+j.evRange:260;   // the Equinox's real-world full charge, miles
  S.chargeAt=(j.chargeAt&&typeof j.chargeAt==='object'&&!Array.isArray(j.chargeAt))?j.chargeAt:{};   // stops where Tim plugs in
  S.who=(j.who&&CREW[j.who])?j.who:null;                                                              // which Field Ninja is signed in on this device
  S.by=(j.by&&typeof j.by==='object'&&!Array.isArray(j.by))?j.by:{};                                 // who marked each stop done
  S.oath=(j.oath&&j.oath.who)?j.oath:null;                                                           // who on this device has read the Philosophy
  // The 2026-09-11 app check is authoritative for the Verizon channel: rebuild those flags from
  // it once, and leave every other channel's flags exactly as they were set by hand.
  if(j.idsSync!==IDS_SYNC){
    J.forEach(x=>{if(x.ch==='Verizon')delete S.loaded[x.id]});
    IDS_LOADED.forEach(i=>{if(BY[i])S.loaded[i]=1});
  }
  S.idsSync=IDS_SYNC;
  if(!isFinite(S.here.time))S.here.time=8;
  if(S.here.key==='gps'&&!S.here.ll)S.here={key:'home',time:S.here.time};
  S.days.forEach(d=>{if(!isFinite(d.startTime))d.startTime=8;
    if(!isFinite(d.startCharge))d.startCharge=100;
    if(!('crew' in d)||(d.crew&&!CREW[d.crew]))d.crew=null;   // a crew mate for the day, or nobody
    if(!PACE[d.pace])d.pace='split';
    if(d.locked&&typeof d.locked!=='object')d.locked={at:0,by:''};   // a locked plan: {at,by}, or null
    if(!d.locked)d.locked=null;
    if(!(d.unlocked&&typeof d.unlocked==='object'))d.unlocked=null;   // the last unlock, kept so a merge cannot undo it
    if(!Array.isArray(d.ids))d.ids=[]});
  S.report=(j.report&&typeof j.report==='object'&&!Array.isArray(j.report))
    ?{to:String(j.report.to||''),cc:String(j.report.cc||''),sent:(j.report.sent&&typeof j.report.sent==='object'&&!Array.isArray(j.report.sent))?j.report.sent:{},seeded:String(j.report.seeded||'')}
    :{to:'',cc:'',sent:{}};   // who the IDS update goes to, which onsite dates they have already been told, and whether the first-run seed has been laid
  S.unshot=(j.unshot&&typeof j.unshot==='object'&&!Array.isArray(j.unshot))?j.unshot:{};   // un-shot tombstones — {at,by} per stop
  // Tue Sep 15 — Cameron with Gabe (TSC 2805, TCC 111911, Chillicothe on the way home). Once.
  S.sync=(j.sync&&typeof j.sync==='object'&&!Array.isArray(j.sync))?j.sync:{key:'',v:0,at:0};   // crew sync: key is per device, never shared state
  S.geo=(j.geo&&typeof j.geo==='object'&&!Array.isArray(j.geo))?j.geo:{};   // coordinates the browser resolved for rows that shipped city-level
  S.mig=(j.mig&&typeof j.mig==='object'&&!Array.isArray(j.mig))?j.mig:{};   // one-time migrations already applied on this device
  S.binds=Array.isArray(j.binds)?j.binds.filter(b=>b&&b.id&&Array.isArray(b.ids)):[];   // named route bindings — DATE:TIME:WHO
  S.checkin=(j.checkin&&typeof j.checkin==='object'&&!Array.isArray(j.checkin))?j.checkin:{};   // arrival stamps for the Run tab — separate from a lock, which means shot
  return true;
}
/* ---------- one-time migrations ----------
   Run on EVERY boot, after the saved state is merged or the book is seeded — a device
   opening the app for the first time takes the seed path, and it needs these too. Each is
   gated on its own S.mig flag, which rides the crew sync, so it happens once per crew copy
   and never argues with a change made in the field afterwards. */
function migrate(){
  if(!S.mig.cameron0915){ S.mig.cameron0915=1;
    if(!S.days.some(d=>d.date==='2026-09-15'))S.days.push(Object.assign(blankDay('2026-09-15'),{crew:'gabe',pace:'split',startTime:7,ids:['2026-9658'].filter(i=>BY[i])})) }
  // Fri 9/25: Lincoln with Cody — Target 217's go-back cleared, Maryville shot on the drive home. The day
  // was never planned in the app, so without it the miles with Cody read zero. A day already on that
  // date keeps its crew if one was set and just gains the two stops. Locked, because a locked plan
  // after a stop's shoot date is how the drive knows the Lincoln leg was a real return trip.
  if(!S.mig.lincoln0925){ S.mig.lincoln0925=1;
    const ids=['2026-9334','2026-5866'].filter(i=>BY[i]), d=S.days.find(x=>x.date==='2026-09-25'), locked={at:Date.parse('2026-09-25T17:00:00Z'),by:'tim'};
    if(d){ d.crew=d.crew||'cody'; d.locked=d.locked||locked; ids.forEach(i=>{ if(!d.ids.includes(i))d.ids.push(i) }) }
    else S.days.push(Object.assign(blankDay('2026-09-25'),{crew:'cody',pace:'split',startTime:6.5,locked,ids})) }
  // 9/26: the past runs are frozen. A day already on one of these dates is Tim's own record — it keeps
  // its route and crew, gains any stop it was missing, and is locked. A date with no day gets the run.
  // (v2, 9/26: the Lincoln first shoot was with Cody — a day this migration wrote itself is brought up to
  // the record; a day Tim planned keeps its route and gains only crew and stops)
  if(S.mig.pastruns0926!==3){ S.mig.pastruns0926=3;   // v3: Gabe on the 9/9 Salina run
    PAST_RUNS.forEach(r=>{ const d=S.days.find(x=>x.date===r[0]), stamp=Date.parse(r[0]+'T23:00:00Z');
      if(!d){ S.days.push(pastRunDay(r)); return }
      const ours=!!(d.locked&&d.locked.by==='tim'&&d.locked.at===stamp);
      if(ours){ Object.assign(d,{crew:r[1],startKey:r[2],endKey:r[3],startTime:r[4],ids:r[5].filter(i=>BY[i]),logMi:d.logMi>0?d.logMi:(r[6]||0)}); return }
      d.crew=d.crew||r[1]; d.locked=d.locked||{at:stamp,by:'tim'};
      r[5].forEach(i=>{ if(BY[i]&&!d.ids.includes(i))d.ids.push(i) }) });
    sortDays();
    if(finishedRun(S.days[S.active])){ const i=S.days.findIndex(d=>!finishedRun(d)); setDay(i<0?S.days.length-1:i) } }
  // the QuickBooks log's miles for the days it covered — a number Tim typed himself stands
  if(!S.mig.logmi0926){ S.mig.logmi0926=1;
    PAST_RUNS.forEach(r=>{ const d=r[6]&&S.days.find(x=>x.date===r[0]); if(d&&!(d.logMi>0))d.logMi=r[6] }) }
  /* 2026-09-23: LOCK used to mean SHOT. A stop locked BEFORE the day it was parked on was a plan
     being locked in, not a store being shot — nobody shoots Thursday's stops on Tuesday. Turn each
     of those into what was meant: the day becomes a locked plan, the stop goes back to PLANNED,
     and its points come off the board until it is really shot. Days and bindings are untouched. */
  if(!S.mig.planlock0923){ S.mig.planlock0923=1;
    const n=convertFutureLocks();
    // Victra 118409 El Dorado sat on the Wichita Friday but was never shot — no invoice, not in the
    // 9/21 update to IDS. Back on the board, and off the Friday binding too.
    S.days.forEach(d=>{ if(d.date==='2026-09-18'&&Array.isArray(d.ids))d.ids=d.ids.filter(i=>i!=='2026-7106') });
    S.binds=(Array.isArray(S.binds)?S.binds:[]).map(b=>{ if(b.date!=='2026-09-18'||!Array.isArray(b.ids)||!b.ids.includes('2026-7106'))return b;
      const ids=b.ids.filter(i=>i!=='2026-7106'); return Object.assign({},b,{ids,stops:ids.length}) });
    if(S.locks['2026-7106']&&S.locks['2026-7106'].d==='2026-09-18'){delete S.locks['2026-7106']; delete S.status['2026-7106']; delete S.by['2026-7106']}   // only the Friday phantom — a later real shot stands
    if(n)setTimeout(()=>toast(n+' stop'+(n===1?'':'s')+' locked ahead of their day: now PLANNED, not shot — the plans stay locked'),900);
  }
  convertFutureLocks();   // standing rule: an old build's future-dated lock arriving by sync is converted too
  /* 2026-09-23: the IDS Master Sheet was read against QuickBooks and the IDS email chain. Every
     banked stop with a date was already on the sheet with that date, except these — the Wichita
     run, Cameron and Chillicothe still sitting on the Master tab undated, four Joplin-week dates
     the sheet has as 9/15, and Gap 1211, which is on neither tab. Everything else starts out as
     "sent", so the Dates-to-report list opens at exactly what the sheet is missing. */
  S.report=(S.report&&typeof S.report==='object'&&!Array.isArray(S.report))?S.report:{to:'',cc:'',sent:{}}; S.report.sent=S.report.sent||{};
  if(!S.report.seeded){ S.report.seeded='0923';   // the flag lives with the ledger it seeds, so they are lost together or not at all
    const OWED=new Set(['2026-5178','2026-4318','2026-6736','2026-8011','2026-7954','2026-0840','2026-4299','2026-8317','2026-1225',
      '2026-1610','2026-7953','2026-8172','2026-8197','2026-8835','2026-0726','2026-7338','2026-8119','2026-5640','2026-3142']);
    // stamped at 0 with the invoice number as of the read: any real send or un-send anywhere on the
    // crew beats a seed on merge, and only the dates the sheet held on 9/23 are seeded — a DATA patch
    // that lands later on a device that never seeded still reaches the list
    J.forEach(j=>{ if(j.wp||!j.dt||j.dt>'2026-09-23'||!IDSLOCK(j)||OWED.has(j.id)||S.report.sent[j.id])return; S.report.sent[j.id]={d:j.dt,inv:j.inv||'',at:0,seed:1} });
    // the corrected dates win over a field lock stamped on the wrong seeded day (Cameron sat on 9/15)
    ['2026-4318','2026-5178','2026-0726','2026-7338','2026-8119','2026-5640'].forEach(id=>{const l=S.locks[id], j=BY[id]; if(l&&j&&j.dt&&l.d!==j.dt)l.d=j.dt});
  }
  const before=S.days.length; S.days=S.days.filter(d=>!isGhostDay(d));
  if(S.days.length!==before&&!S.days.length)S.days.push(blankDay(''));
  sinkAll();   // shot stops always sit at the bottom — the ↑/↓ indices depend on it
}
