/* ---------- custom jobs: pasted straight from the IDS email ----------
   Line format (tab-separated, as the email arrives):
     Client ⇥ Site ⇥ Address ⇥ City ⇥ ST ⇥ Name
   Optional: an IDS id (2026-1234) as the FIRST column, lat ⇥ lon as the LAST two.
   Channel / hours / service time are borrowed from an existing job of the same
   client; coordinates from an existing job in the same city (offline, instant),
   else Nominatim (online), else the line is refused — the router needs a fix. */
const AGENTS=/^(verizon|russell|tcc|cellular sales|victra|wireless zone)/i;
function inferFrom(cl,c,s){
  const lc=x=>String(x||'').toLowerCase();
  const same=J.find(j=>lc(j.cl)===lc(cl));
  const near=J.find(j=>lc(j.c)===lc(c)&&lc(j.s)===lc(s)&&isFinite(j.lat)&&isFinite(j.lon));
  return {ch: same?same.ch : AGENTS.test(cl)?'Verizon' : cl,
          o: same?same.o:10, x: same?same.x:19, sv: same?same.sv:0.9,
          ll: near?[near.lat,near.lon]:null, r: near?near.r:'Custom'};
}
function parseJobLines(text){
  const out=[],errs=[];
  String(text||'').split(/\r?\n/).forEach((raw,n)=>{
    const line=raw.trim(); if(!line)return;
    let t=line.split('\t').map(x=>x.trim()).filter(Boolean);
    if(t.length<5)t=line.split(/\s{2,}|\s\|\s/).map(x=>x.trim()).filter(Boolean);
    let id=null, ll=null;
    if(t.length&&/^\d{4}-\d{4}$/.test(t[0]))id=t.shift();
    const L=t.length;
    if(L>=7){const lat=+t[L-2],lon=+t[L-1];
      if(isFinite(lat)&&isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180){ll=[lat,lon];t.length=L-2}}
    if(t.length<5){errs.push(`Line ${n+1}: need Client ⇥ Site ⇥ Address ⇥ City ⇥ ST (⇥ Name) — got ${t.length} field${t.length===1?'':'s'}`);return}
    const [cl,site,a,c,s]=t, name=t[5]||`${cl} ${site} - ${c}, ${s.toUpperCase()}`;
    out.push({id,cl,site,a,c,s:s.toUpperCase(),n:name,ll});
  });
  return {out,errs};
}
async function geocode(a,c,s){
  try{
    const q=encodeURIComponent(`${a}, ${c}, ${s}`);
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=${q}`,{headers:{Accept:'application/json'}});
    const j=await r.json(); if(j&&j[0])return [+j[0].lat,+j[0].lon];
  }catch(e){}
  return null;
}
function applyCustom(){ (S.custom||[]).forEach(j=>{ if(!BY[j.id]){J.push(j);BY[j.id]=j} }); }
/* ---------- rows that shipped without real coordinates ----------
   A job carrying geo:0 was added from the Master Sheet with its city's coordinates,
   not its own address — fine for a total, wrong for routing (PR #41). The first time
   the app runs online it resolves them one a second, saves the result, and never asks
   again. Offline it simply stays approximate and retries next load. */
function applyGeo(){
  const hb=S.geo&&S.geo.home; if(Array.isArray(hb)&&isFinite(hb[0])){BASE[0]=hb[0];BASE[1]=hb[1]}
  Object.entries(S.geo||{}).forEach(([k,ll])=>{ if(!k.startsWith('place:'))return;
    const p=PLACES[k.slice(6)]; if(p&&Array.isArray(ll)&&isFinite(ll[0])){p.ll=[ll[0],ll[1]]; p.geo=1} });
  Object.entries(S.geo||{}).forEach(([id,ll])=>{const j=BY[id];
  if(j&&Array.isArray(ll)&&isFinite(ll[0])&&isFinite(ll[1])){j.lat=ll[0];j.lon=ll[1];j.geo=1;j.hs=String(j.hs||'').replace(/ · coords ≈ city[^·]*/,'')} }); }
async function fixGeo(){
  // home base first — every leg of every day is measured from it
  if(!(S.geo&&S.geo.home)){
    const p=HOME_ADDR.split(', '); const ll=await geocode(p[0],p[1],p[2]);
    if(ll){S.geo.home=ll; BASE[0]=ll[0]; BASE[1]=ll[1]; dirty(); render()}
    await new Promise(r=>setTimeout(r,1100));
  }
  // a baked place that shipped with a town-centre guess — put it on its own driveway
  for(const [k,p] of Object.entries(PLACES)){
    if(p.geo!==0||!p.addr||(S.geo&&S.geo['place:'+k]))continue;
    const a=p.addr.split(', '); const ll=await geocode(a[0],a[1],a[2]);
    if(ll){S.geo['place:'+k]=ll; p.ll=ll; p.geo=1; dirty(); render()}
    await new Promise(r=>setTimeout(r,1100));
  }
  const todo=J.filter(j=>j.geo===0&&!(S.geo&&S.geo[j.id]));
  if(!todo.length)return; let n=0;
  for(const j of todo){
    const ll=await geocode(j.a,j.c,j.s);
    if(ll){S.geo[j.id]=ll; j.lat=ll[0]; j.lon=ll[1]; j.geo=1; j.hs=String(j.hs||'').replace(/ · coords ≈ city[^·]*/,''); n++}
    await new Promise(r=>setTimeout(r,1100));   // Nominatim: one request a second
  }
  if(n){dirty(); render(); toast('Placed '+n+' location'+(n===1?'':'s')+' at its real address')}
}
function uniqueId(base){ let id=base,n=2; while(BY[id])id=base+'-'+(n++); return id; }
async function addCustomJobs(text,pay,svMin){
  const {out,errs}=parseJobLines(text), added=[], failed=[...errs];
  for(const r of out){
    const inf=inferFrom(r.cl,r.c,r.s);
    let ll=r.ll||inf.ll, approx=!r.ll&&!!inf.ll;
    if(!ll){ll=await geocode(r.a,r.c,r.s);approx=false}
    if(!ll){failed.push(`${r.n}: couldn't place ${r.c}, ${r.s} — no job there yet and the geocoder is unreachable. Add lat ⇥ lon as the last two columns.`);continue}
    const lc=x=>String(x||'').trim().toLowerCase();
    const dup=J.find(j=>(r.site&&String(j.site)===String(r.site)&&lc(j.cl)===lc(r.cl))||lc(j.n)===lc(r.n));   // same site+client, or same name
    if(dup){failed.push(`${r.n}: already in the book as ${dup.id}${done(dup.id)?' (done)':''} — skipped.`);continue}
    const id=(r.id&&!BY[r.id])?r.id:uniqueId('new-'+r.site);
    const job={id,n:r.n,a:r.a,c:r.c,s:r.s,cl:r.cl,ch:inf.ch,p:(+pay>0?+pay:100),lat:ll[0],lon:ll[1],
      o:inf.o,x:inf.x,v:0,hs:r.cl+' brand default'+(approx?' · coords ≈ '+r.c:''),r:inf.r,st:'',
      sv:(+svMin>0?+svMin/60:inf.sv),wo:'',site:String(r.site),custom:1};
    S.custom.push(job); J.push(job); BY[id]=job; added.push(job);
  }
  if(added.length){dirty();render()}
  return {added,failed};
}
function removeCustomJob(id){
  S.custom=(S.custom||[]).filter(j=>j.id!==id);
  const k=J.findIndex(j=>j.id===id); if(k>=0)J.splice(k,1); delete BY[id];
  S.days.forEach(d=>d.ids=d.ids.filter(i=>i!==id));
  ['status','loaded','sv','notes','timers'].forEach(f=>{if(S[f])delete S[f][id]});
  dirty();render();
}
/* ---------- custom places: where Tim sleeps or starts (friends, family, a motel) ----------
   Kept in S.places and merged into PLACES at boot, so popts() lists them in
   Start from / End at on every day. Address is geocoded when online; if not,
   coordinates are borrowed from a job in the same city and the name says "≈". */
function applyPlaces(){ Object.entries(S.places||{}).forEach(([k,v])=>{PLACES[k]=v}); }
function slugKey(name){
  const b='pl-'+(String(name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24)||'place');
  let k=b,n=2; while(PLACES[k])k=b+'-'+(n++); return k;
}
async function addPlace(name,a,c,s,latlon){
  name=String(name||'').trim(); a=String(a||'').trim(); c=String(c||'').trim(); s=String(s||'').trim().toUpperCase();
  if(!name||!c||!s)return {err:'Need at least a name, a city and a state.'};
  let ll=null, approx=false;
  const m=String(latlon||'').match(/(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/);
  if(m&&Math.abs(+m[1])<=90&&Math.abs(+m[2])<=180)ll=[+m[1],+m[2]];
  if(!ll&&a)ll=await geocode(a,c,s);                       // a house wants precision — try the address first
  if(!ll){const inf=inferFrom('',c,s); if(inf.ll){ll=inf.ll;approx=true}}   // offline: same-city job
  if(!ll)return {err:`Couldn't place ${c}, ${s}. Add "lat, lon" or try a fuller address.`};
  const key=slugKey(name), v={name:name+(approx?' (≈ '+c+')':''),ll,a:[a,c,s].filter(Boolean).join(', ')};
  S.places[key]=v; PLACES[key]=v; dirty(); render(); return {key};
}
function removePlace(key){
  delete S.places[key]; delete PLACES[key];
  S.days.forEach(d=>{if(d.startKey===key)d.startKey='home'; if(d.endKey===key)d.endKey='home'});
  dirty(); render();
}
/* ---------- the IDS "please load" message: send it, copy it, remember it ---------- */
function niceDate(iso){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); if(!m)return iso||'';
  return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}
async function copyText(t,preEl){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(t);return true} }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly','');
       ta.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none';
       document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,t.length);
       const ok=document.execCommand('copy'); ta.remove(); if(ok)return true }catch(e){}
  try{ if(preEl){const r=document.createRange(); r.selectNodeContents(preEl); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r)} }catch(e){}
  return false;   // caller tells Tim the text is selected
}

/* ---------- waypoints: stops that aren't field jobs (lunch, a hotel, a hardware run, a friend's) ----------
   Modelled as a custom job with wp:1 and $0, so routing, timing, the map and the stop list work

const initialsOf=name=>{const w=String(name||'').split(/[^a-z0-9]+/i).filter(Boolean);
  return ((w.length>1?w.map(x=>x[0]).join(''):String(name||'')).slice(0,3)).toUpperCase()||'•'};
async function addWaypoint(name,a,c,s,mins,latlon){
  if(dayLocked(day()))return {err:'This plan is locked — unlock it on Plan to add a stop.'};
  name=String(name||'').trim(); a=String(a||'').trim(); c=String(c||'').trim(); s=String(s||'').trim().toUpperCase();
  if(!name||!c||!s)return {err:'Need at least a name, a city and a state.'};
  let ll=null, approx=false;
  const m=String(latlon||'').match(/(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/);
  if(m&&Math.abs(+m[1])<=90&&Math.abs(+m[2])<=180)ll=[+m[1],+m[2]];
  if(!ll&&a)ll=await geocode(a,c,s);
  if(!ll){const inf=inferFrom('',c,s); if(inf.ll){ll=inf.ll;approx=true}}
  if(!ll)return {err:`Couldn't place ${c}, ${s}. Add "lat, lon" or try a fuller address.`};
  const id=uniqueId('stop-'+(name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,20)||'stop'));
  const job={id,n:name,a:a||c,c,s,cl:'Stop',ch:'Stop',p:0,lat:ll[0],lon:ll[1],o:0,x:24,v:1,
    hs:'any time'+(approx?' · coords ≈ '+c:''),r:'Stop',st:'',sv:Math.max(5,+mins||30)/60,wo:'',site:'',custom:1,wp:1};
  S.custom.push(job); J.push(job); BY[id]=job; S.loaded[id]=1;   // never "not in app" — IDS doesn't know it exists
  const d=day(); if(!d.ids.includes(id))d.ids.push(id);
  dirty(); render(); return {id};
}
let CJ_OPEN=false, PL_OPEN=false, ST_OPEN=false;
let GB_OPEN=false, GB_ROW='';   // the go-back accordion: the bar, and which row is showing its list
let APP_SENT_OPEN=false;        // the IDS tab: whether the "already sent" dates are unfolded
function boot(){
  let local=null;
  try{
    const t=localStorage.getItem(LSKEY);
    if(t)local=JSON.parse(t);
  }catch(e){}
  const loaded=local&&mergeState(local);
  if(!loaded)seed();
  applyCustom();               // custom jobs must be in J/BY before the first render
  applyGeo();                  // …and any coordinates the browser resolved on an earlier run
  applyPlaces();               // …and custom places in PLACES, so the day dropdowns list them
  migrate();                   // …and whatever this build knows that this device does not
  dirty();                     // save either way, so a migration flag is not re-applied next load
  const today=new Date(), iso=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  const ti=S.days.findIndex(d=>d.date===iso);
  const cur=S.days[S.active];
  const stale=!cur||!cur.date||cur.date<iso;   // the day you were on is in the past
  if(ti>=0&&stale&&ti!==S.active)S.active=ti;
  S.activeDate=(S.days[S.active]&&S.days[S.active].date)||'';
  ready=true;
  render();
  renderWho(); $('#whoChip').onclick=whoSheet;
  detectWho().then(ok=>{ if(!ok&&!S.who)whoSheet(); else if(needsOath())oathSheet() });
  setTimeout(fixGeo,1500);     // after the first paint, quietly place any city-level rows
  adoptLinkKey().then(ok=>{ if(ok&&!SYNCTIMERS)armSync() });
  if(syncOn()){syncChipShow(); syncPull(true).then(()=>syncPush());
    armSync();
  }   // like the Dojo: who are you → the Philosophy → I'm in
  chip(loaded?'Loaded your plan':'Ready to plan','ok');
}
function csvText(){
  const rows=[['Day','Date','Stop','Arrive','Depart','Leg mi','Location ID','WO','Site','Location','Address','City','State','Channel','End client','Payout','Opens','Closes','Hours','Job status','Onsite date','Invoice','Capture status','By','With','In app']];
  S.days.forEach((d,di)=>{const s=simulate(d);
    s.rows.forEach((r,i)=>{const j=BY[r.id];
      rows.push([di+1,d.date,i+1,r.bank?'':hhmm(r.arr),r.bank?'':hhmm(r.fin),r.bank?'':r.leg.toFixed(1),j.id,j.wo||'',j.site||'',j.n,j.a,j.c,j.s,j.ch||'',j.cl,j.p,hhmm(j.o),hhmm(j.x),j.v?'verified':'assumed',j.st||'',j.dt||'',j.inv||'',stat(j.id),S.by[j.id]&&CREW[S.by[j.id]]?CREW[S.by[j.id]].short:'',d.crew&&CREW[d.crew]?CREW[d.crew].short:'',S.loaded[j.id]?'yes':'no'])})});
  return rows.map(r=>r.map(v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');
}
function doCsv(){
  try{
    const blob=new Blob([csvText()],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url;link.download='ninja360-run-sheet.csv';
    document.body.appendChild(link);link.click();link.remove();
    URL.revokeObjectURL(url);toast('CSV downloaded');
  }catch(e){toast('Could not download the CSV')}
}
/* ---------- the Verizon running total: how many there are, how many are done, how many are left ----------
   The whole Verizon channel in one glance, at the top of Score. Done = shot by us or banked by IDS
   (one definition, the same as everywhere else); on hold is counted apart; left is everything still
   to shoot. The three always add up to the total — a held stop that is also banked counts once. */
function verizonTotal(){
  const vz=J.filter(j=>!j.wp&&j.ch==='Verizon'&&j.st!=='Removed');
  const total=vz.length, done=vz.filter(j=>LOCKED(j.id)).length,
        hold=vz.filter(j=>HOLD(j)&&!LOCKED(j.id)).length, left=vz.filter(UNEARNED).length;
  const owed=vz.filter(j=>GOBACK(j.id)||(j.st==='Return Owed'&&!shot(j.id))).length;
  const leftPts=vz.filter(UNEARNED).reduce((t,j)=>t+j.p,0);
  const pct=total?Math.round(done/total*100):0;
  // The pie is the ninja. Every stop shot uncovers a slice of him, clockwise from twelve; what is
  // still to do sits under a grey fog with the count on it in red, and on-hold is a darker band.
  const C=70, R=62, TAU=2*Math.PI;
  const xy=(f,k)=>[C+R*k*Math.cos(TAU*f-Math.PI/2), C+R*k*Math.sin(TAU*f-Math.PI/2)].map(v=>v.toFixed(2));
  const slice=(f0,f1,attrs)=>{ const f=f1-f0; if(f<=0)return '';
    if(f>=.9999)return `<circle cx="${C}" cy="${C}" r="${R}" ${attrs}/>`;
    return `<path d="M${C} ${C} L${xy(f0,1).join(' ')} A${R} ${R} 0 ${f>.5?1:0} 1 ${xy(f1,1).join(' ')} Z" ${attrs}/>`};
  // a crisp white spoke on every slice boundary, and a red rim along the shot share's outer edge
  const spoke=f=>{const [x,y]=xy(f,1); return `<line x1="${C}" y1="${C}" x2="${x}" y2="${y}" stroke="var(--surf)" stroke-width="3.5" stroke-linecap="round"/>`};
  const rim=f=>f<=0?'':f>=.9999?`<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="var(--vz)" stroke-width="7"/>`
    :`<path d="M${xy(0,1).join(' ')} A${R} ${R} 0 ${f>.5?1:0} 1 ${xy(f,1).join(' ')}" fill="none" stroke="var(--vz)" stroke-width="7" stroke-linecap="butt"/>`;
  const fd=total?done/total:0, fh=total?hold/total:0, fl=Math.max(0,1-fd-fh);
  // the count of what is left sits on a solid pill in the middle of the fogged slice — while there is room for it
  const [lx,ly]=xy(fd+fh+fl/2,.5).map(Number), PW=58, PH=38;
  const label=fl>=.25?`<rect x="${(lx-PW/2).toFixed(1)}" y="${(ly-PH/2).toFixed(1)}" width="${PW}" height="${PH}" rx="10" fill="var(--surf)" fill-opacity=".97" stroke="var(--vz)" stroke-width="1.5"/>
      <text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="middle" fill="var(--vz)" font-family="IBM Plex Mono,ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="800"><tspan font-size="23">${left}</tspan><tspan x="${lx.toFixed(1)}" dy="11" font-size="8" letter-spacing="1.6">LEFT</tspan></text>`:'';
  const pie=`<svg class="vzpie" viewBox="0 0 140 140" role="img" aria-label="${done} of ${total} Verizon stores done, ${left} left, ${hold} on hold">
      <defs><clipPath id="vzclip"><circle cx="${C}" cy="${C}" r="${R}"/></clipPath></defs>
      <circle cx="${C}" cy="${C}" r="${R}" fill="var(--surf)"/>
      <image href="/assets/verizon-ninja.png" x="${C-R}" y="${C-R}" width="${2*R}" height="${2*R}" clip-path="url(#vzclip)" preserveAspectRatio="xMidYMid slice"/>
      ${slice(fd,fd+fh,'fill="var(--ink2)" fill-opacity=".86" data-cover="hold"')}${slice(fd+fh,1,'fill="var(--vz-fog)" fill-opacity=".9" data-cover="left"')}
      ${fd>0&&fd<.9999?spoke(0)+spoke(fd):''}${fh>0&&fd+fh<.9999?spoke(fd+fh):''}
      <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="var(--ink)" stroke-opacity=".28" stroke-width="2"/>${rim(fd)}${label}</svg>`;
  return `<div class="sb-hero card vz" id="vzTotal">
      <div class="lab">Verizon &middot; scoreboard</div>
      <div class="vzrow"><div class="vzpiewrap">${pie}<div class="vzpct">${pct}%</div></div>
        <div class="vzsb mono">
          <b class="red" id="vzDone">${done}</b><span>done</span>
          <b id="vzLeft">${left}</b><span>left</span>
          <b class="dim" id="vzAll">${total}</b><span>total</span>
        </div></div>
      <div class="vzleg"><span><i style="background:var(--vz);border-color:var(--vz)"></i><b>${pct}%</b> done</span>${hold?'<span><i style="background:var(--ink2)"></i><b id="vzHold">'+hold+'</b> on hold</span>':''}<span><i style="background:var(--vz-fog)"></i><b>${fmt(leftPts)}</b> to go</span></div>
      ${owed?'<div class="vzowed"><b>'+owed+'</b> go-back'+(owed===1?'':'s')+' owed</div>':''}
    </div>`;
}
