<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light dark}body{margin:0;padding:0}img{max-width:100%}</style>
</head>
<body>
<title>Ninja-360 Run Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F1ED; --surf:#FFFFFF; --surf2:#FAF7F4; --surf3:#EFE9E3;
  --ink:#231E1A; --ink2:#6B6058; --ink3:#746A61; --line:#E3DAD1; --line2:#D2C6BA;
  --accent:#B54903; --accent-ink:#FFFFFF; --accent-soft:#FCEADA;
  --money:#2C6B4F; --money-soft:#E2F0E8;
  --warn:#8F6410; --warn-soft:#FAEFD8;
  --bad:#A2352A; --bad-soft:#F8E3E0;
  --shadow:0 1px 2px rgba(60,42,28,.07),0 4px 14px rgba(60,42,28,.05);
  --head-bg:#231E1A; --head-ink:#FBF7F3; --head-sub:#B9AC9F; --head-line:#4A4139;
  --scrim:rgba(35,30,26,.45);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#151310; --surf:#1E1B17; --surf2:#232019; --surf3:#2C2820;
  --ink:#F1EBE4; --ink2:#A99C90; --ink3:#9A8F83; --line:#332D25; --line2:#443C32;
  --accent:#F4801F; --accent-ink:#1A1409; --accent-soft:#3A2410;
  --money:#6FC49B; --money-soft:#1B3327;
  --warn:#E0AC4C; --warn-soft:#33280F;
  --bad:#EE8377; --bad-soft:#3A1F1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --head-bg:#0E0C0A; --head-ink:#F1EBE4; --head-sub:#95897E; --head-line:#3A332B;
  --scrim:rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#151310; --surf:#1E1B17; --surf2:#232019; --surf3:#2C2820;
  --ink:#F1EBE4; --ink2:#A99C90; --ink3:#9A8F83; --line:#332D25; --line2:#443C32;
  --accent:#F4801F; --accent-ink:#1A1409; --accent-soft:#3A2410;
  --money:#6FC49B; --money-soft:#1B3327;
  --warn:#E0AC4C; --warn-soft:#33280F;
  --bad:#EE8377; --bad-soft:#3A1F1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --head-bg:#0E0C0A; --head-ink:#F1EBE4; --head-sub:#95897E; --head-line:#3A332B;
  --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 13px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h2{font-size:15px;margin:16px 0 7px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lab{font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:600;color:var(--ink3)}
.hide{display:none!important}
header{background:var(--head-bg);color:var(--head-ink);padding:12px 0 10px}
header h1{font-size:18px;letter-spacing:-.2px;color:var(--head-ink)}
header .sub{font-size:12px;color:var(--head-sub);margin-top:1px}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hbtns{display:flex;gap:6px;align-items:center}
.tbtn{border:1px solid var(--head-line);color:var(--head-ink);border-radius:8px;padding:6px 10px;font-size:12px;min-height:32px}
/* who's running: their emblem sits right beside the Ninja mark — one tap to switch */
.whochip{width:38px;height:38px;border-radius:50%;padding:0;flex:none;overflow:hidden;margin-left:-4px;
  border:2px solid var(--accent);background:#141414;color:var(--head-ink);display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 4px rgba(0,0,0,.25)}
.whochip img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.whochip .wn{font-weight:800;font-size:15px;line-height:1}
.whochip.empty{border-style:dashed;opacity:.85}
.shbtn.who{display:flex;align-items:center;gap:10px}
.shbtn.who img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#111;flex:none}
.bychip{width:16px;height:16px;border-radius:50%;object-fit:cover;vertical-align:-3px;margin-left:4px;background:#111}
#syncChip{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px}
#syncChip.ok{color:#9CD8B4;border-color:#3E594A}
#syncChip.busy{color:var(--head-sub)}
#syncChip.warn2{color:#E0AC4C;border-color:#5C4A1E}
/* counters */
.counters{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
  border-bottom:1px solid var(--line)}
@media(min-width:560px){.counters{grid-template-columns:repeat(4,1fr)}}
.cc{background:var(--surf);padding:7px 12px}
.cc .v{font-size:16px;font-weight:700;letter-spacing:-.3px}
.cc .v.g{color:var(--money)} .cc .v.o{color:var(--accent)} .cc .v.w{color:var(--warn)}
/* strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:11px;overflow:hidden;margin:9px 0}
@media(min-width:640px){.strip{grid-template-columns:repeat(6,1fr)}}
.strip.four{grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.strip.four{grid-template-columns:repeat(4,1fr)}}
.mcell{background:var(--surf);padding:7px 10px}
.mcell .v{font-size:16px;font-weight:700;letter-spacing:-.3px;margin-top:1px}
.mcell .v.g{color:var(--money)} .mcell .v.w{color:var(--warn)} .mcell .v.b{color:var(--bad)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:11px;box-shadow:var(--shadow);margin-bottom:10px}
.brand-hero{position:relative;display:flex;justify-content:center;align-items:center;margin:8px 0 14px;padding:6px 0;transition:opacity .7s ease,transform .7s ease,height .7s ease,margin .7s ease,padding .7s ease;overflow:hidden}
.brand-hero.is-done{opacity:0;transform:translateY(-8px);height:0;margin:0;padding:0;pointer-events:none}
.brand-video-frame{position:relative;width:min(100%,980px);margin:0 auto;border-radius:18px;overflow:hidden;background:#060808;box-shadow:0 18px 40px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.04)}
.brand-video-frame video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
.brand-logo-overlay{position:absolute;right:14px;bottom:12px;width:92px;max-width:28%;height:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.42));z-index:1}
.brand-panel{background:transparent;border:none;border-radius:0;box-shadow:none;overflow:visible;padding:0}
/* the brand, always on: header lockup + the Plan tab's entry panel (ninja360.net tokens: charcoal + orange) */
.hbrand{display:flex;align-items:center;gap:10px;min-width:0}
.hmark{width:38px;height:38px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.hbrand h1{letter-spacing:-.01em;white-space:nowrap}
.h360{color:#FF8D2D}
.h1sub{font-weight:500;opacity:.7;font-size:.78em}
.brand-static{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 14px;margin:6px 0 12px;padding:14px 16px;
  border-radius:16px;background:linear-gradient(135deg,#31343B,#1d1f24);color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.22);overflow:hidden}
.brand-static .bs-word{font:800 clamp(26px,7vw,40px)/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:-.02em}
.brand-static .bs-word span{color:#FF8D2D}
.brand-static .bs-tag{font-weight:600;font-size:13px;letter-spacing:.02em;color:#d4d7dd;grid-column:1}
.brand-static img{grid-column:2;grid-row:1/3;width:min(34vw,150px);height:auto;max-height:96px;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}
.evin{display:inline-flex;align-items:center;gap:6px}
.evin input{width:66px}
.mcell .bat{text-transform:none;letter-spacing:0;font-weight:600;margin-top:2px}
.brand-panel img,.brand-panel video{display:block;width:min(100%,760px);height:auto;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.38))}
.brand-hero .brand-main img{max-height:440px}
.brand-hero .brand-video{display:none}
.brand-strip{display:none}
.rail{display:flex;gap:6px;overflow-x:auto;padding:2px 0 7px}
.rail::-webkit-scrollbar{height:5px}.rail::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.dchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surf);border-radius:10px;
  padding:6px 10px;text-align:left;min-width:100px;box-shadow:var(--shadow)}
.dchip.on{border-color:var(--accent);background:var(--accent-soft)}
.dchip .dd{font-size:10.5px;color:var(--ink2);font-weight:600}
.dchip .dv{font-size:14px;font-weight:700}
.dchip .dn{font-size:10px;color:var(--ink3)}
.dchip.add{min-width:auto;display:flex;align-items:center;color:var(--accent);font-weight:600;border-style:dashed}
.fld{display:flex;flex-direction:column;gap:3px}
.row{display:flex;flex-wrap:wrap;gap:7px;align-items:end}
select,input[type=date],input[type=time],input[type=text],input[type=number]{
  padding:8px 9px;border:1px solid var(--line2);border-radius:8px;background:var(--surf2);
  color:var(--ink);font-size:13.5px;font-family:inherit;max-width:210px;min-height:36px}
.ghost{border:1px solid var(--line2);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;background:var(--surf2);min-height:36px}
.ghost.danger{color:var(--bad);border-color:var(--bad)}
.prim{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 14px;font-weight:600;font-size:13.5px;min-height:38px}
.stop{display:grid;grid-template-columns:58px 1fr auto;gap:9px;align-items:start;
  background:var(--surf);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:10px;padding:9px 10px;margin-bottom:6px;box-shadow:var(--shadow)}
.stop.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.stop.wait{border-left-color:var(--warn)}
.stop.done{border-left-color:var(--money);opacity:.72}
.stop .tm{font-size:12px;font-weight:600;color:var(--ink2)}
.stop .tm .to{display:block;color:var(--ink3);font-weight:400}
.stop .nm{font-size:14px;font-weight:600;line-height:1.25}
.stop .ad{font-size:12px;color:var(--ink2);margin-top:2px}
.stop .hrs{font-size:11px;color:var(--ink3);margin-top:3px}
.stop .pay{font-size:14px;font-weight:700;color:var(--money);white-space:nowrap}
.acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line2);border-radius:7px;min-width:30px;min-height:30px;padding:0 8px;font-size:12px;
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);background:var(--surf2)}
.mini.x{color:var(--bad);border-color:var(--bad)}
.mini.go{color:var(--accent);border-color:var(--accent);font-weight:600}
.tset{font:inherit;color:var(--accent);text-decoration:underline dotted;
  display:inline-flex;align-items:center;min-height:26px;padding:2px 6px;margin:-2px -2px}
.job-note{font-size:12px;color:var(--ink2);margin-top:6px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surf2)}
.job-note .mono{font-size:11px}
.live-timer{display:inline-flex;align-items:center;gap:6px;padding:2px 6px;border-radius:999px;border:1px solid var(--line2);background:var(--surf2);font-size:11px;font-weight:600;color:var(--ink2)}
.live-timer.running{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:1px;white-space:nowrap}
.badge.v{background:var(--money-soft);color:var(--money)}
.badge.a{background:var(--surf3);color:var(--ink2)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.filters input{flex:1;min-width:130px;max-width:none}
.pj{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;
  background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px}
.pj.used{opacity:.45}
.pj .nm{font-size:13.5px;font-weight:600;line-height:1.25}
.pj .ad{font-size:11.5px;color:var(--ink2);margin-top:1px}
.pj .dist{font-size:11.5px;color:var(--ink3);white-space:nowrap;text-align:right}
.pjbtn{display:block;text-align:left;padding:0;color:inherit;width:100%}
.addb{background:var(--accent);color:var(--accent-ink);border-radius:8px;width:34px;height:34px;
  font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;line-height:1}
.addb.dis{background:var(--surf3);color:var(--ink2)}
.mapbox{background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:7px;box-shadow:var(--shadow)}
svg{width:100%;height:auto;display:block}
.mapbox circle.hit{cursor:pointer}
/* Leaflet map (online) — the SVG below it is the offline fallback */
#lmap{height:clamp(320px,60vh,560px);border-radius:8px;overflow:hidden;background:var(--surf2)}
#lmap.hide,#map.hide{display:none}
.leaflet-container{font-family:inherit;font-size:12px}
/* the global svg{width:100%;height:auto} rule (for the drawn fallback map) would collapse
   Leaflet's overlay svg to 0×0 and clip every dot and route line — restore the default */
.leaflet-overlay-pane svg{width:auto;height:auto}
.leaflet-container a{color:var(--accent)}
.leaflet-tooltip{font-size:11.5px;padding:4px 7px}
/* Ninja‑360 branded pins — geometry and colours from the "Ninja‑360 Branded Map Pins" design */
.npx{background:none;border:0}
.npin{display:flex;flex-direction:column;align-items:center;width:26px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.45));cursor:pointer}
.npin .head{position:relative;width:26px;height:26px;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 30% 25%,var(--l),var(--b) 55%,var(--d) 100%)}
.npin .tail{width:13px;height:26px;margin-top:-9px;z-index:1;clip-path:polygon(50% 100%,0 0,100% 0);
  background:radial-gradient(circle at 30% 0%,var(--l),var(--b) 55%,var(--d) 100%)}
.npin.sel{width:52px;filter:drop-shadow(0 7px 10px rgba(0,0,0,.5))}
.npin.sel .head{width:52px;height:52px;box-shadow:0 0 0 5px var(--r);
  background:radial-gradient(circle at 30% 25%,var(--l),var(--b) 45%,var(--d) 100%)}
.npin.sel .tail{width:26px;height:42px;margin-top:-17px;
  background:radial-gradient(circle at 30% 0%,var(--l),var(--b) 45%,var(--d) 100%)}
.npin.sel.late .head{box-shadow:0 0 0 5px rgba(162,53,42,.65)}   /* not in the design: store shuts before you arrive */
.npin .disc{position:absolute;inset:14%;border-radius:50%;background:#fff;border:2px solid var(--a);box-sizing:border-box;
  display:flex;align-items:center;justify-content:center}
.npin .ini{font:800 15px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--b);letter-spacing:-.02em}
.npin .nmark{width:80%;height:80%;object-fit:contain;display:block}
.npin .nsym{width:80%;height:80%;display:block}
.ndot{position:relative;width:22px;height:22px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 30% 25%,var(--l),var(--b) 55%,var(--d) 100%);box-shadow:0 2px 5px rgba(0,0,0,.4)}
.nbadge{position:absolute;left:100%;top:-4px;margin-left:-8px;z-index:3;display:flex;border-radius:16px;overflow:hidden;white-space:nowrap;
  box-shadow:0 3px 8px rgba(0,0,0,.4);font:800 13px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.nbadge .dn{background:radial-gradient(circle at 30% 25%,#ffcf8a,#f7941d 55%,#c95f00 100%);padding:6px 9px;color:#fff}
.nbadge .lf{background:#2b2e36;padding:6px 9px;color:#c7cad0}
.ndot .nbadge{top:-8px;transform:scale(.8);transform-origin:left top}
.ndot.sm{width:12px;height:12px;box-shadow:0 1px 3px rgba(0,0,0,.4)}   /* state-level zoom — not in the design */
/* Selected pin at region / state zoom — smaller so a day's stops don't clump into one blob */
.npin.sel.sel-m{width:44px}
.npin.sel.sel-m .head{width:44px;height:44px;box-shadow:0 0 0 4px var(--r)}
.npin.sel.sel-m .tail{width:22px;height:36px;margin-top:-15px}
.npin.sel.sel-m .ini{font-size:13px}
.npin.sel.sel-s{width:36px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.45))}
.npin.sel.sel-s .head{width:36px;height:36px;box-shadow:0 0 0 3px var(--r)}
.npin.sel.sel-s .tail{width:18px;height:30px;margin-top:-13px}
.npin.sel.sel-s .ini{font-size:11px}
.npin.sel.sel-s .nbadge{top:-6px;transform:scale(.8);transform-origin:left top}
/* on-site timer chips: only show once a timer has actually run */
.live-timer.idle{display:none}
/* start / end / home — not in the design; kept in the badge's dark‑pill language */
.lnum{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
  background:#2b2e36;color:#fff;font:800 11px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.lnum.home{background:#fff;color:#2b2e36;border-color:#2b2e36;font-size:13px}
/* real chargers, pulled from Open Charge Map — distinct blue so they never read as a job */
.chgx{background:none;border:none}
.chg{width:22px;height:22px;border-radius:7px;background:var(--b);color:var(--a);display:flex;align-items:center;justify-content:center;
  font:800 10px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:-.03em;border:1.5px solid var(--ring,#fff);box-shadow:0 2px 5px rgba(0,0,0,.35);cursor:pointer}
.chg svg{width:66%;height:66%;display:block}
.chg .ini{transform:translateY(.5px)}
.chg.c{width:26px;height:26px;border-radius:8px;font-size:10.5px}    /* city zoom: the network's letters */
.chg.md{width:16px;height:16px;border-radius:5px;border-width:1.25px}
.chg.sm{width:11px;height:11px;border-radius:3px;border-width:1px;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.chg.ts{box-shadow:0 0 0 2px #FF8D2D,0 2px 6px rgba(0,0,0,.35)}      /* truck stop at an interstate exit: orange halo */
.chg{position:relative}
.chg.fav{box-shadow:0 0 0 2px #FFC220,0 0 10px rgba(255,194,32,.75),0 2px 6px rgba(0,0,0,.35)}   /* favorite: gold halo outside the brand ring */
.chg.c{border-width:2px}   /* up close the brand ring reads — IONNA's orange pinstripe */
.chg .star{position:absolute;top:-8px;right:-8px;font-size:12px;line-height:1;color:#FFC220;text-shadow:0 1px 2px rgba(0,0,0,.55);font-style:normal}
.chg.md .star{top:-7px;right:-7px;font-size:10px}
.leg .ci.fav{box-shadow:0 0 0 1.5px #FFC220}
.leg .ci{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;margin-right:5px;
  background:var(--b);color:var(--a);font:800 7.5px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;border:1px solid var(--ring,#fff);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.leg .ci.ts{box-shadow:0 0 0 1.5px #FF8D2D}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--ink2);margin-top:6px;align-items:center}
.leg i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:-1px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);z-index:1100;padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:8px 2px 9px;font-size:10.5px;font-weight:600;color:var(--ink3);
  display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--accent)}
nav .ic{font-size:16px;line-height:1}
nav .dotN{position:absolute;top:4px;right:calc(50% - 22px);background:var(--accent);color:var(--accent-ink);
  border-radius:9px;font-size:9px;padding:0 4px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));background:var(--head-bg);color:var(--head-ink);
  padding:9px 15px;border-radius:9px;font-size:13px;z-index:1180;box-shadow:var(--shadow);max-width:88vw;
  display:flex;gap:12px;align-items:center}
.toast button{color:#FFB27A;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.6px;padding:2px 0}
.empty{color:var(--ink3);font-size:13.5px;padding:16px 2px;text-align:center}
.note{font-size:12.5px;color:var(--ink2);margin:7px 0}
.hint{font-size:12px;color:var(--ink3);margin:4px 0 9px}
/* paste panels: add jobs / add places */
.cj summary{cursor:pointer;list-style:none;user-select:none}.cj summary::-webkit-details-marker{display:none}
.cj textarea{width:100%;box-sizing:border-box;min-height:88px;font:inherit;font-size:12.5px;line-height:1.35;padding:8px;
  border:1px solid var(--line);border-radius:9px;background:var(--surf2);color:var(--ink);white-space:pre;overflow-x:auto}
.cj input{font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surf2);color:var(--ink);min-height:36px}
.cj .pj{display:flex;gap:8px;align-items:center;margin-top:6px}
pre.req{background:var(--surf2);border:1px solid var(--line);border-radius:9px;padding:10px;
  font-size:11.5px;white-space:pre-wrap;word-break:break-word;max-height:290px;overflow:auto;margin:0}
.chk{width:19px;height:19px;accent-color:var(--accent)}
.seg{display:flex;gap:3px;background:var(--surf3);padding:3px;border-radius:9px;margin-bottom:9px}
.seg button{flex:1;padding:7px 4px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:var(--shadow)}
.clus{border-left:3px solid var(--money)}
table.pl{width:100%;border-collapse:collapse;font-size:13px}
table.pl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);
  padding:5px 6px;border-bottom:1px solid var(--line)}
table.pl td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
/* scoreboard */
table.pl [data-lock]{min-height:40px;min-width:62px;font-weight:700;letter-spacing:.3px}
table.pl [data-lock]:not(.go){border-color:var(--accent);color:var(--accent)}
.sb-hero{text-align:center;padding:15px 13px 13px}
.sb-big{font-size:46px;font-weight:700;letter-spacing:-1.5px;line-height:1;color:var(--money);margin:3px 0 2px}
.sb-sub{font-size:13px;color:var(--ink2);margin-bottom:9px}
.bar2{height:9px;background:var(--surf3);border-radius:5px;overflow:hidden}
.bar2 span{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .35s ease}
.sb-belt{margin-top:9px;font-size:12.5px;color:var(--ink2);letter-spacing:.2px}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:9px 0 4px}
.daycol{text-align:center}
.daycol.today .dlab{color:var(--accent);font-weight:700}
.dbar{height:52px;display:flex;align-items:flex-end;justify-content:center;gap:2px;
  background:var(--surf2);border:1px solid var(--line);border-radius:6px;padding:3px}
.dbar span{width:9px;border-radius:2px 2px 0 0;min-height:2px}
.dbar .plan{background:var(--line2)}
.dbar .got{background:var(--money)}
.dlab{font-size:10px;color:var(--ink3);margin-top:3px;font-weight:600}
.dpts{font-size:10.5px;color:var(--money);font-weight:700;min-height:13px}
@media (prefers-reduced-motion:reduce){.bar2 span{transition:none}}
/* bottom sheet */
/* Leaflet's panes and controls sit at 400–1000: everything fixed over the map lives above that */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:1170}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1171;background:var(--surf);
  border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:none;
  box-shadow:0 -8px 30px rgba(0,0,0,.18);max-height:78vh;overflow:auto;
  padding:8px 15px calc(16px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:2px auto 10px}
.sheet.tall{max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch}
/* the Philosophy — three lanes */
.oath .ph{position:relative;border-left:3px solid var(--accent);padding:7px 44px 8px 14px;margin:10px 0;background:var(--surf2);border-radius:0 10px 10px 0}
.oath .phn{position:absolute;right:12px;top:8px;font:800 12px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--accent);letter-spacing:.1em}
.oath h4{margin:0 0 2px;font-size:16px;line-height:1.15}
.oath .lead{font-size:13px;color:var(--ink2);margin:0 0 6px}
.oath ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink2)}
.oath li{margin:2px 0}
.oath-daily{margin:14px 0 0;padding:10px 14px;border-radius:10px;background:var(--surf2);font-size:14px;line-height:1.5}
.oath-daily .lab{margin-bottom:4px}
.oath-daily .fs{font-weight:800;font-size:16px;margin-top:4px;color:var(--accent)}
.oath-ask{margin:14px 0 8px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;text-align:center}
.oath-ask b{display:block;font-size:16px;margin-bottom:2px}
.oath-ask div{font-size:13px;color:var(--ink2)}
.oath-yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oath-yn button{min-height:48px;font-size:16px;font-weight:700}
/* the gate — between the app (below) and the sheet (above) */
#gate{position:fixed;inset:0;z-index:1160;background:radial-gradient(900px 600px at 50% 30%,#2a1c0e,#141210 70%);color:#f2eae0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#gate img{width:min(64vw,300px);height:auto;filter:drop-shadow(0 12px 28px rgba(0,0,0,.65))}
#gate .gt{font:800 24px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:.01em}
#gate .gd{font-size:15px;line-height:1.55;max-width:340px}
#gate .gd .lab{color:#FABB7C;margin-bottom:4px}
#gate .gd .fs{font-weight:800;font-size:18px;color:#F47920;margin-top:6px}
#gate .gc{font-size:14px;opacity:.8}
#gate button{background:transparent;color:#f2eae0;border:1px solid rgba(242,234,224,.45);margin-top:4px;padding:10px 18px;font-weight:700}
.sheet h3{font-size:15px;margin-bottom:2px}
.sheet .shsub{font-size:12px;color:var(--ink2);margin-bottom:10px}
.shlist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.shbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;
  border:1px solid var(--line2);border-radius:9px;padding:11px 12px;font-size:13.5px;font-weight:600;background:var(--surf2)}
.shbtn small{color:var(--ink3);font-weight:400}
.shbtn.danger{color:var(--bad);border-color:var(--bad)}
.shbtn.cur{border-color:var(--accent);background:var(--accent-soft)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .18s ease-out}
  .sheet{animation:up .2s ease-out}
  .scrim{animation:fade .2s ease-out}
}
@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>

async function fetchOCM(lat,lng,miles,max,key){

  const keep=list=>list.filter(fast).forEach(p=>{const a=p.AddressInfo||{}; CLIST.set(p.ID||(a.Latitude+','+a.Longitude),p)});
  if(CCACHE[key]){keep(CCACHE[key]);return true}

      +'&distance='+miles.toFixed(1)+'&distanceunit=Miles&maxresults='+max+'&levelid=3&minpowerkw=50&compact=true&verbose=false&key='+OCM_KEY;
    const r=await fetch(url); if(!r.ok)throw 0;

function buildClusters(){
  let pool=unscheduled().slice();
  const out=[];
  while(pool.length&&out.length<26){
    pool.sort((a,b)=>b.p-a.p||mi(BASE,LL(a))-mi(BASE,LL(b)));
    const seed=pool[0];
    const far=mi(BASE,LL(seed))>95;
    let d={id:'c',date:'',startKey:'home',startTime:far?7:8,endKey:'home',ids:[seed.id]};
    const rest=pool.filter(j=>j.id!==seed.id).sort((a,b)=>mi(LL(seed),LL(a))-mi(LL(seed),LL(b)));
    for(let n=0;n<rest.length;n++){
      const j=rest[n];
      if(mi(LL(seed),LL(j))>(far?70:38))continue;
      const cand={...d,ids:d.ids.concat(j.id)};
      cand.ids=autoOrder(cand);
      const s=simulate(cand);
      if(s.bad===0&&s.span<=(far?11.5:10)) d=cand;
      if(d.ids.length>=10)break;
    }
    d.ids=autoOrder(d);
    const s=simulate(d);
    out.push({ids:d.ids,startTime:d.startTime,pay:s.pay,miles:s.miles,span:s.span,end:s.end,
      area:[...new Set(d.ids.map(i=>BY[i].c))].slice(0,5).join(' · '),far:far});
    const used=new Set(d.ids); pool=pool.filter(j=>!used.has(j.id));
  }

}

function inferFrom(cl,c,s){
  const lc=x=>String(x||'').toLowerCase();
  const same=J.find(j=>lc(j.cl)===lc(cl));
  const near=J.find(j=>lc(j.c)===lc(c)&&lc(j.s)===lc(s)&&isFinite(j.lat)&&isFinite(j.lon));
  return {ch: same?same.ch : AGENTS.test(cl)?'Verizon' : cl,
          o: same?same.o:10, x: same?same.x:19, sv: same?same.sv:0.9,
          ll: near?[near.lat,near.lon]:null, r: near?near.r:'Custom'};

function parseJobLines(text){
  const out=[],errs=[];
  String(text||'').split(/\r?\n/).forEach((raw,n)=>{
    const line=raw.trim(); if(!line)return;
    let t=line.split('\t').map(x=>x.trim()).filter(Boolean);
    if(t.length<5)t=line.split(/\s{2,}|\s\|\s/).map(x=>x.trim()).filter(Boolean);
    let id=null, ll=null;
    if(t.length&&/^\d{4}-\d{4}$/.test(t[0]))id=t.shift();
    const L=t.length;
    if(L>=7){const lat=+t[L-2],lon=+t[L-1];
      if(isFinite(lat)&&isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180){ll=[lat,lon];t.length=L-2}}
    if(t.length<5){errs.push(`Line ${n+1}: need Client ⇥ Site ⇥ Address ⇥ City ⇥ ST (⇥ Name) — got ${t.length} field${t.length===1?'':'s'}`);return}
    const [cl,site,a,c,s]=t, name=t[5]||`${cl} ${site} - ${c}, ${s.toUpperCase()}`;

  });

    const lc=x=>String(x||'').trim().toLowerCase();

  S.custom=(S.custom||[]).filter(j=>j.id!==id);
  const k=J.findIndex(j=>j.id===id); if(k>=0)J.splice(k,1); delete BY[id];
  S.days.forEach(d=>d.ids=d.ids.filter(i=>i!==id));
  ['status','loaded','sv','notes','timers'].forEach(f=>{if(S[f])delete S[f][id]});
  dirty();render();
}
/* ---------- custom places: where Tim sleeps or starts (friends, family, a motel) ----------
   Kept in S.places and merged into PLACES at boot, so popts() lists them in
   Start from / End at on every day. Address is geocoded when online; if not,
   coordinates are borrowed from a job in the same city and the name says "≈". */
function applyPlaces(){ Object.entries(S.places||{}).forEach(([k,v])=>{PLACES[k]=v}); }
function slugKey(name){
  const b='pl-'+(String(name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24)||'place');
  let k=b,n=2; while(PLACES[k])k=b+'-'+(n++); return k;
}
async function addPlace(name,a,c,s,latlon){
  name=String(name||'').trim(); a=String(a||'').trim(); c=String(c||'').trim(); s=String(s||'').trim().toUpperCase();
  if(!name||!c||!s)return {err:'Need at least a name, a city and a state.'};
  let ll=null, approx=false;
  const m=String(latlon||'').match(/(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/);
  if(m&&Math.abs(+m[1])<=90&&Math.abs(+m[2])<=180)ll=[+m[1],+m[2]];
  if(!ll&&a)ll=await geocode(a,c,s);                       // a house wants precision — try the address first
  if(!ll){const inf=inferFrom('',c,s); if(inf.ll){ll=inf.ll;approx=true}}   // offline: same-city job
  if(!ll)return {err:`Couldn't place ${c}, ${s}. Add "lat, lon" or try a fuller address.`};
  const key=slugKey(name), v={name:name+(approx?' (≈ '+c+')':''),ll,a:[a,c,s].filter(Boolean).join(', ')};
  S.places[key]=v; PLACES[key]=v; dirty(); render(); return {key};
}
function removePlace(key){
  delete S.places[key]; delete PLACES[key];
  S.days.forEach(d=>{if(d.startKey===key)d.startKey='home'; if(d.endKey===key)d.endKey='home'});
  dirty(); render();
}
/* ---------- the IDS "please load" message: send it, copy it, remember it ---------- */
function niceDate(iso){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); if(!m)return iso||'';
  return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}
async function copyText(t,preEl){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(t);return true} }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly','');
       ta.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none';
       document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,t.length);
       const ok=document.execCommand('copy'); ta.remove(); if(ok)return true }catch(e){}
  try{ if(preEl){const r=document.createRange(); r.selectNodeContents(preEl); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r)} }catch(e){}
  return false;   // caller tells Tim the text is selected
}
function noteRequest(ids){ if(ids&&ids.length){S.lastRequest={at:Date.now(),ids:[...ids]}; dirty()} }
/* ---------- waypoints: stops that aren't field jobs (lunch, a hotel, a hardware run, a friend's) ----------
   Modelled as a custom job with wp:1 and $0, so routing, timing, the map and the stop list work
   unchanged; kept out of the IDS request, the Board, the pool and the payout counters. */
const initialsOf=name=>{const w=String(name||'').split(/[^a-z0-9]+/i).filter(Boolean);
  return ((w.length>1?w.map(x=>x[0]).join(''):String(name||'')).slice(0,3)).toUpperCase()||'•'};
async function addWaypoint(name,a,c,s,mins,latlon){
  name=String(name||'').trim(); a=String(a||'').trim(); c=String(c||'').trim(); s=String(s||'').trim().toUpperCase();
  if(!name||!c||!s)return {err:'Need at least a name, a city and a state.'};
  let ll=null, approx=false;
  const m=String(latlon||'').match(/(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/);
  if(m&&Math.abs(+m[1])<=90&&Math.abs(+m[2])<=180)ll=[+m[1],+m[2]];
  if(!ll&&a)ll=await geocode(a,c,s);
  if(!ll){const inf=inferFrom('',c,s); if(inf.ll){ll=inf.ll;approx=true}}
  if(!ll)return {err:`Couldn't place ${c}, ${s}. Add "lat, lon" or try a fuller address.`};
  const id=uniqueId('stop-'+(name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,20)||'stop'));
  const job={id,n:name,a:a||c,c,s,cl:'Stop',ch:'Stop',p:0,lat:ll[0],lon:ll[1],o:0,x:24,v:1,
    hs:'any time'+(approx?' · coords ≈ '+c:''),r:'Stop',st:'',sv:Math.max(5,+mins||30)/60,wo:'',site:'',custom:1,wp:1};
  S.custom.push(job); J.push(job); BY[id]=job; S.loaded[id]=1;   // never "not in app" — IDS doesn't know it exists
  const d=day(); if(!d.ids.includes(id))d.ids.push(id);
  dirty(); render(); return {id};
}
let CJ_OPEN=false, PL_OPEN=false, ST_OPEN=false;
function boot(){
  let local=null;
  try{
    const t=localStorage.getItem(LSKEY);
    if(t)local=JSON.parse(t);
  }catch(e){}
  const loaded=local&&mergeState(local);
  if(!loaded)seed();
  applyCustom();               // custom jobs must be in J/BY before the first render
  applyPlaces();               // …and custom places in PLACES, so the day dropdowns list them
  if(loaded)dirty();
  const today=new Date(), iso=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  const ti=S.days.findIndex(d=>d.date===iso);
  if(ti>=0&&ti!==S.active)S.active=ti;
  ready=true;
  render();
  renderWho(); $('#whoChip').onclick=whoSheet;
  detectWho().then(ok=>{ if(!ok&&!S.who)whoSheet(); else if(needsOath())oathSheet() });   // like the Dojo: who are you → the Philosophy → I'm in
  chip(loaded?'Loaded your plan':'Ready to plan','ok');
}
function csvText(){
  const rows=[['Day','Date','Stop','Arrive','Depart','Leg mi','Location ID','WO','Site','Location','Address','City','State','Channel','End client','Payout','Opens','Closes','Hours','Job status','Onsite date','Invoice','Capture status','By','In app']];
  S.days.forEach((d,di)=>{const s=simulate(d);
    s.rows.forEach((r,i)=>{const j=BY[r.id];
      rows.push([di+1,d.date,i+1,hhmm(r.arr),hhmm(r.fin),r.leg.toFixed(1),j.id,j.wo||'',j.site||'',j.n,j.a,j.c,j.s,j.ch||'',j.cl,j.p,hhmm(j.o),hhmm(j.x),j.v?'verified':'assumed',j.st||'',j.dt||'',j.inv||'',stat(j.id),S.by[j.id]&&CREW[S.by[j.id]]?CREW[S.by[j.id]].short:'',S.loaded[j.id]?'yes':'no'])})});
  return rows.map(r=>r.map(v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');
}
function doCsv(){
  try{
    const blob=new Blob([csvText()],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url;link.download='ninja360-run-sheet.csv';
    document.body.appendChild(link);link.click();link.remove();
    URL.revokeObjectURL(url);toast('CSV downloaded');
  }catch(e){toast('Could not download the CSV')}
}
boot();
