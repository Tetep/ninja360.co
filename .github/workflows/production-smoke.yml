name: Production Smoke

on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Production Smoke (Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Require Dojo login secrets
        env:
          DOJO_USER: ${{ secrets.DOJO_USER }}
          DOJO_PASS: ${{ secrets.DOJO_PASS }}
        run: |
          if [ -z "$DOJO_USER" ] || [ -z "$DOJO_PASS" ]; then
            echo "::error::DOJO_USER and DOJO_PASS must both be set as repo secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Run production smoke checks
        env:
          # The Dojo is behind a password. Add both as repo secrets (Settings > Secrets and variables > Actions).
          DOJO_USER: ${{ secrets.DOJO_USER }}
          DOJO_PASS: ${{ secrets.DOJO_PASS }}
        run: npm run test:smoke:prod

      - name: Upload Playwright artifacts (if failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
